var globalGeometry;
var globalDateList;

// Cloud mask function for Landsat 8/9
function maskL8sr(image) {
  var cloudShadowBitMask = (1 << 3);
  var cloudsBitMask = (1 << 5);
  var qa = image.select('QA_PIXEL');
  var mask = qa.bitwiseAnd(cloudShadowBitMask).eq(0)
      .and(qa.bitwiseAnd(cloudsBitMask).eq(0));
  return image.updateMask(mask);
}

// Reclassification function for Se2WaQ

function loadData() {
  globalGeometry = drawingTools.layers().get(0).getEeObject();
  var startDate = ee.Date(startDateBox.getValue());
  var endDate = ee.Date(endDateBox.getValue());
  var mode = modeSelect.getValue();
  var parameter = parameterSelect.getValue();

  if (!globalGeometry) {
    print('Σφάλμα: Παρακαλώ σχεδιάστε πρώτα ' + (mode === 'Ανάλυση Περιοχής (ROI)' ? 'μια περιοχή' : 'μια γραμμή') + '.');
    return;
  }

  currentGeometry = globalGeometry;

  if (mode === 'Ανάλυση Υψομέτρου Λίμνης') {
    runLakeHeightAnalysis(globalGeometry, startDateBox.getValue(), endDateBox.getValue());
    return;
  }

  print('Αναζήτηση διαθέσιμων εικόνων...');
  sliderPanel.clear();
  sliderPanel.add(ui.Label('Φόρτωση...'));

  var bounds = mode === 'Ανάλυση Περιοχής (ROI)' ? globalGeometry : globalGeometry.buffer(1000);

  if (parameter.indexOf('Temperature') > -1) {
    print('Loading Landsat 8/9 data for temperature...');
    var l9 = ee.ImageCollection('LANDSAT/LC09/C02/T1_L2')
      .filterBounds(bounds)
      .filterDate(startDate, endDate)
      .map(maskL8sr);
    var l8 = ee.ImageCollection('LANDSAT/LC08/C02/T1_L2')
      .filterBounds(bounds)
      .filterDate(startDate, endDate)
      .map(maskL8sr);
    globalImageCollection = ee.ImageCollection(l8.merge(l9)).sort('system:time_start');

  } else {
    print('Loading Sentinel-2 L1C data...');
    // **** CHANGED TO L1C DATA ****
    globalImageCollection = ee.ImageCollection("COPERNICUS/S2_HARMONIZED")
      .filterBounds(bounds)
      .filterDate(startDate, endDate)
      .filter(ee.Filter.lt('CLOUDY_PIXEL_PERCENTAGE', 35))
      .sort('system:time_start');
  }

  var timestamps = globalImageCollection.aggregate_array('system:time_start');

  timestamps.evaluate(function(tsList) {
    if (tsList && tsList.length > 0) {
      var dateList = tsList.map(function(timestamp) {
        var d = new Date(timestamp);
        var year = d.getFullYear();
        var month = ('0' + (d.getMonth() + 1)).slice(-2);
        var day = ('0' + d.getDate()).slice(-2);
        return year + '-' + month + '-' + day;
      });
      
      print('Βρέθηκαν ' + dateList.length + ' εικόνες.');
      globalDateList = dateList;
      sliderPanel.clear();

      if (mode === 'Ανάλυση Περιοχής (ROI)') {
        setupRegionAnalysis(dateList);
      } else {
        setupTransectAnalysis(dateList);
      }
    } else {
      print('Δεν βρέθηκαν εικόνες για αυτή την περίοδο.');
      sliderPanel.clear();
      sliderPanel.add(ui.Label('Δεν βρέθηκαν εικόνες.'));
    }
  });
}

var showImageForDate = function() {};

function setupRegionAnalysis(dateList) {
  var dateSlider = ui.Slider({
    min: 0,
    max: dateList.length - 1,
    value: 0,
    step: 1,
    style: {stretch: 'horizontal'},
    onChange: function(value) {
      var index = Math.round(value);
      showImageForDate(dateList[index]);
    }
  });
  
  var dateLabel = ui.Label('', {fontWeight: 'bold'});
  sliderPanel.add(ui.Label('Σύρετε για αλλαγή ημερομηνίας:'));
  sliderPanel.add(dateSlider);
  sliderPanel.add(dateLabel);

  showImageForDate = function(dateString) {
    dateLabel.setValue('Αναζήτηση για: ' + dateString);
    var selectedDate = ee.Date(dateString);
    var nearestImage = ee.Image(globalImageCollection.filter(ee.Filter.maxDifference({
      difference: 1000 * 60 * 60 * 24 * 3,
      leftField: 'system:time_start',
      rightValue: selectedDate.millis()
    })).sort('system:time_start').first());
    
    nearestImage.get('system:time_start').evaluate(function(val) {
      if (!val) {
        dateLabel.setValue('Δεν βρέθηκε κοντινή εικόνα για: ' + dateString);
        return;
      }
      
      var parameterName = parameterSelect.getValue();
      var vizParams = getVizParams(parameterName);

      var rawImage = processImage(nearestImage, parameterName, true);
      
      var imageToShow = rawImage;
         var clippedImage = imageToShow.clip(globalGeometry);
      var layer = ui.Map.Layer(clippedImage, vizParams, parameterName.split(' - ')[0]);
      
      map.layers().set(1, layer);
      dateLabel.setValue('Εμφάνιση για: ' + ee.Date(val).format('YYYY-MM-dd').getInfo());
      updateLegend(parameterName, vizParams);
    });
  };
  
  if (comparisonMode) {
    collectROITimeSeries();
  }
  
  parameterSelect.onChange(function(selectedParam) {
    var isTrueColor = selectedParam.indexOf('True Color') > -1;
    var isTemp = selectedParam.indexOf('Temperature') > -1;

    modeSelect.setDisabled(isTrueColor);
    paramWarningLabel.setValue('');
    if (isTrueColor) {
      modeSelect.setValue('Ανάλυση Περιοχής (ROI)', true);
      paramWarningLabel.setValue('Η ανάλυση Transect δεν είναι διαθέσιμη για την προβολή Πραγματικού Χρώματος.');
    }
    if (isTemp) {
      paramWarningLabel.setValue('Η θερμοκρασία υπολογίζεται από δεδομένα Landsat 8/9.');
    }
    
    if (globalDateList && globalDateList.length > 0) {
      var currentIndex = dateSlider.getValue();
      showImageForDate(globalDateList[Math.round(currentIndex)]);
    }
  });

  showImageForDate(dateList[0]);
  parameterSelect.setValue(parameterSelect.getValue(), true);
}


function setupTransectAnalysis(dateList) {
  sliderPanel.add(ui.Label('Επεξεργασία δεδομένων transect...', {fontWeight: 'bold'}));
  chartPanel.style().set('shown', true);
  mapPanel.style().set('width', '70%');
  
  var numPoints = parseInt(numPointsBox.getValue()) || 50;
  var selectedParam = parameterSelect.getValue();
  var line = ee.Geometry(globalGeometry);
  
  line.coordinates().evaluate(function(coords) {
    if (!coords || coords.length < 2) {
      print('Error: Invalid line geometry.');
      return;
    }
    
    var points = [];
    var totalLength = 0;
    var segmentLengths = [];
    for (var i = 0; i < coords.length - 1; i++) {
        var p1 = coords[i];
        var p2 = coords[i+1];
        var dx = p1[0] - p2[0];
        var dy = p1[1] - p2[1];
        var length = Math.sqrt(dx * dx + dy * dy);
        segmentLengths.push(length);
        totalLength += length;
    }

    var cumulativeLength = 0;
    var segmentIndex = 0;
    
    for (var i = 0; i < numPoints; i++) {
        var targetDist = (i / (numPoints - 1)) * totalLength;
        if (i === numPoints - 1) {
          targetDist = totalLength;
        }
        
        while (targetDist > cumulativeLength + segmentLengths[segmentIndex] && segmentIndex < segmentLengths.length - 1) {
            cumulativeLength += segmentLengths[segmentIndex];
            segmentIndex++;
        }
        
        var distIntoSegment = targetDist - cumulativeLength;
        var fractionAlongSegment = 0;
        if (segmentLengths[segmentIndex] > 0) {
            fractionAlongSegment = distIntoSegment / segmentLengths[segmentIndex];
        }

        var startPoint = coords[segmentIndex];
        var endPoint = coords[segmentIndex + 1];
        
        var x = startPoint[0] + (endPoint[0] - startPoint[0]) * fractionAlongSegment;
        var y = startPoint[1] + (endPoint[1] - startPoint[1]) * fractionAlongSegment;
        
        points.push(ee.Feature(ee.Geometry.Point([x, y]), { index: i }));
    }

    var pointsFC = ee.FeatureCollection(points);
    map.layers().set(2, ui.Map.Layer(pointsFC, {color: 'yellow'}, 'Transect Points'));
    processTransectData(pointsFC, numPoints, selectedParam);
  });
}

function processTransectData(pointsFC, numPoints, selectedParam) {
  var values = globalImageCollection.map(function(image) {
    var date = ee.Date(image.get('system:time_start'));
    var unmaskedImage = image.unmask(0);
    
    var processedImage = processImage(unmaskedImage, selectedParam, false);
    var bandName = processedImage.bandNames().get(0);

    var waterMask;
    if (selectedParam.indexOf('Temperature') > -1) {
      waterMask = unmaskedImage.select('QA_PIXEL').bitwiseAnd(1 << 7).gt(0).rename('water');
    } else {
      waterMask = safeNormalizedDifference(unmaskedImage, 'B3', 'B8').gt(0).rename('water');
    }
    
    var combinedImage = processedImage.addBands(waterMask);

    var sampledData = combinedImage.reduceRegions({
        collection: pointsFC,
        reducer: ee.Reducer.first(),
        scale: 30,
        tileScale: 4
    });

    var vals = sampledData.aggregate_array(bandName);
    var isWater = sampledData.aggregate_array('water');
    
    return ee.Feature(null, {
      date: date.format('YYYY-MM-dd'),
      values: vals,
      is_water: isWater
    });
  });
  
  values.evaluate(function(result) {
    if (!result) {
      sliderPanel.clear();
      sliderPanel.add(ui.Label('Σφάλμα: Δεν ήταν δυνατή η ανάλυση των δεδομένων.'));
      return;
    }
    
    var features = result.features || result;
    if (!Array.isArray(features) || features.length === 0) {
      sliderPanel.clear();
      sliderPanel.add(ui.Label('Σφάλμα: Δεν βρέθηκαν δεδομένα.'));
      return;
    }
    
    var data = [], dates = [], isWaterData = [];
    
    for (var i = 0; i < features.length; i++) {
      var feature = features[i];
      if (feature && feature.properties && feature.properties.values) {
        dates.push(feature.properties.date);
        data.push(feature.properties.values);
        isWaterData.push(feature.properties.is_water);
      }
    }
    
    if (data.length === 0) {
      sliderPanel.clear();
      sliderPanel.add(ui.Label('Δεν βρέθηκαν έγκυρα δεδομένα.'));
      return;
    }
    
    currentAnalysisData = {
      type: 'transect',
      parameter: selectedParam,
      data: data,
      dates: dates,
      isWaterData: isWaterData,
      geometry: globalGeometry
    };
    
    createTransectHeatmap(data, dates, isWaterData, selectedParam);
    sliderPanel.clear();
    sliderPanel.add(ui.Label('Ανάλυση transect ολοκληρώθηκε!', {fontWeight: 'bold'}));
    
    var updateButton = ui.Button({
      label: 'Ενημέρωση γραφήματος',
      onClick: function() { setupTransectAnalysis(globalDateList); },
      style: {stretch: 'horizontal'}
    });
    sliderPanel.add(updateButton);
    
    saveResultButton.style().set('shown', true);
    
    // Store current analysis data for comparison
    currentParameter = selectedParam;
    currentTransectData = data;
    currentTransectDates = dates;
    currentWaterFlags = isWaterData;
    
    // Auto-save if in comparison mode
    if (comparisonMode) {
      saveCurrentAnalysis();
    }
  });
}

function saveCurrentAnalysis() {
  var currentMode = modeSelect.getValue();
  var resultData = null;
  
  // Prepare data based on current analysis mode
  if (currentMode === 'Ανάλυση Γραμμής (Transect)') {
    if (!currentTransectData || !currentTransectDates || !currentParameter) {
      ui.alert('Σφάλμα', 'Δεν υπάρχουν διαθέσιμα δεδομένα transect για αποθήκευση.', ui.ErrorBox);
      return;
    }
    resultData = {
      type: 'transect',
      data: currentTransectData,
      dates: currentTransectDates,
      waterFlags: currentWaterFlags
    };
  } else if (currentMode === 'Ανάλυση Υψομέτρου Λίμνης') {
    if (!currentLakeData || !currentLakeDates || !currentLakeParameter) {
      ui.alert('Σφάλμα', 'Δεν υπάρχουν διαθέσιμα δεδομένα λίμνης για αποθήκευση.', ui.ErrorBox);
      return;
    }
    resultData = {
      type: 'lake_height',
      data: currentLakeData,
      dates: currentLakeDates,
      method: lakeMethodSelect.getValue(),
      ndwiThreshold: lakeNdwiSlider.getValue()
    };
  } else {
    ui.alert('Σφάλμα', 'Αυτός ο τύπος ανάλυσης δεν υποστηρίζει αποθήκευση.', ui.ErrorBox);
    return;
  }
  
  if (!resultData) return;
  
  var resultId = 'result_' + Date.now();
  var defaultName = currentParameter || currentLakeParameter || 'Ανάλυση';
  var resultName = ui.prompt('Εισάγετε όνομα για την ανάλυση:', {
    placeholder: defaultName + ' - ' + new Date().toLocaleDateString(),
    required: true
  });
  
  if (resultName) {
    var result = {
      id: resultId,
      name: resultName,
      type: resultData.type,
      parameter: currentParameter || currentLakeParameter,
      timestamp: new Date().toISOString()
    };
    
    // Add type-specific data
    if (resultData.type === 'transect') {
      result.data = resultData.data;
      result.dates = resultData.dates;
      result.waterFlags = resultData.waterFlags;
    } else if (resultData.type === 'lake_height') {
      result.data = resultData.data;
      result.dates = resultData.dates;
      result.method = resultData.method;
      result.ndwiThreshold = resultData.ndwiThreshold;
    }
    
    savedResults.push(result);
    
    // Keep only the most recent results
    if (savedResults.length > maxSavedResults) {
      savedResults.shift();
    }
    
    updateComparisonUI();
    ui.alert('Επιτυχία', 'Η ανάλυση αποθηκεύτηκε με επιτυχία!', 'success');
  }
}

function updateComparisonUI() {
  if (!comparisonPanel) return;
  
  // Clear existing content but keep the title and close button
  while (comparisonPanel.widgets().length() > 2) {
    comparisonPanel.remove(comparisonPanel.widgets().get(2));
  }
  
  // Add instructions
  var instructions = ui.Label(
    'Επιλέξτε αναλύσεις για σύγκριση (2-3 αναλύσεις):',
    {fontWeight: 'bold', margin: '0 0 10px 0'}
  );
  comparisonPanel.add(instructions);
  
  if (savedResults.length === 0) {
    comparisonPanel.add(ui.Label('Δεν υπάρχουν αποθηκευμένες αναλύσεις για σύγκριση.'));
    return;
  }
  
  // Add compare button if at least 2 analyses of the same type are selected
  var selectedTransect = selectedForComparison.filter(id => 
    transectResults.some(r => r.id === id)
  );
  var selectedLake = selectedForComparison.filter(id => 
    lakeResults.some(r => r.id === id)
  );
  
  if (selectedTransect.length >= 2 || selectedLake.length >= 2) {
    var compareButton = ui.Button({
      label: `Σύγκριση επιλεγμένων (${selectedForComparison.length})`,
      onClick: compareSelectedResults,
      style: { 
        margin: '15px 0 0 0',
        backgroundColor: '#4CAF50',
        color: 'white',
        stretch: 'horizontal'
      }
    });
    comparisonPanel.add(compareButton);
  }
}

// Helper function to add results to the panel
function addResultsToPanel(results) {
  results.forEach(function(result) {
    var isSelected = selectedForComparison.includes(result.id);
    var container = ui.Panel({
      widgets: [
        ui.Checkbox({
          label: result.name,
          value: isSelected,
          onChange: function(checked) {
            toggleResultForComparison(result.id, checked);
          }
        }),
        ui.Label(getResultDescription(result), {margin: '0 0 0 10px', color: '#666'}),
        ui.Button({
          label: 'Διαγραφή',
          onClick: function() {
            savedResults = savedResults.filter(r => r.id !== result.id);
            selectedForComparison = selectedForComparison.filter(id => id !== result.id);
            updateComparisonUI();
          },
          style: {margin: '0 0 0 10px'}
        })
      ],
      layout: ui.Panel.Layout.flow('horizontal')
    });
    comparisonPanel.add(container);
  });
}

// Helper function to get a description for a result
function getResultDescription(result) {
  if (result.type === 'transect') {
    return result.parameter || 'Transect Analysis';
  } else if (result.type === 'lake_height') {
    var desc = 'Ύψος Λίμνης';
    if (result.method) desc += ' - ' + result.method;
    if (result.ndwiThreshold) desc += ' (NDWI: ' + result.ndwiThreshold + ')';
    return desc;
  }
  return 'Analysis';
}
  
  // Add compare button if at least 2 analyses are selected
  if (selectedForComparison.length >= 2) {
    var compareButton = ui.Button({
      label: `Σύγκριση επιλεγμένων (${selectedForComparison.length})`,
      onClick: compareSelectedResults,
      style: { 
        margin: '15px 0 0 0',
        backgroundColor: '#4CAF50',
        color: 'white',
        stretch: 'horizontal'
      }
    });
    comparisonPanel.add(compareButton);
  }
}

function toggleResultForComparison(resultId, checked) {
  if (checked) {
    if (!selectedForComparison.includes(resultId)) {
      selectedForComparison.push(resultId);
    }
  } else {
    selectedForComparison = selectedForComparison.filter(id => id !== resultId);
  }
  updateComparisonUI();
}

function compareSelectedResults() {
  if (selectedForComparison.length < 2) {
    ui.alert('Σφάλμα', 'Επιλέξτε τουλάχιστον 2 αναλύσεις για σύγκριση.', ui.ErrorBox);
    return;
  }
  
  var selectedResults = savedResults.filter(r => selectedForComparison.includes(r.id));
  
  // Create a chart with multiple series
  var chartData = [['Date']];
  var series = {};
  
  // Add parameter names as series headers
  selectedResults.forEach((result, idx) => {
    var paramName = result.parameter.split(' - ')[0];
    chartData[0].push(paramName);
    series[idx] = {};
  });
  
  // Collect all unique dates
  var allDates = [];
  selectedResults.forEach(result => {
    result.dates.forEach(date => {
      if (!allDates.includes(date)) {
        allDates.push(date);
      }
    });
  });
  allDates.sort();
  
  // Initialize data structure
  allDates.forEach(date => {
    var row = [new Date(date)];
    selectedResults.forEach(() => row.push(null));
    chartData.push(row);
  });
  
  // Fill in the data
  selectedResults.forEach((result, resultIdx) => {
    result.dates.forEach((date, dateIdx) => {
      var rowIdx = allDates.indexOf(date) + 1; // +1 for header row
      if (rowIdx > 0) {
        // Calculate average value for this date
        var values = [];
        for (var i = 0; i < result.data[dateIdx].length; i++) {
          if (result.waterFlags[dateIdx][i] && result.data[dateIdx][i] !== null) {
            values.push(result.data[dateIdx][i]);
          }
        }
        if (values.length > 0) {
          var avg = values.reduce((a, b) => a + b, 0) / values.length;
          chartData[rowIdx][resultIdx + 1] = avg; // +1 for date column
        }
      }
    });
  });
  
  // Create the chart
  var chart = ui.Chart(chartData, 'LineChart', {
    title: 'Σύγκριση Παραμέτρων',
    hAxis: {title: 'Ημερομηνία', format: 'MMM dd'},
    vAxes: {
      0: {title: 'Τιμές'}
    },
    series: {
      0: {targetAxisIndex: 0},
      1: {targetAxisIndex: 0}
    },
    chartArea: {width: '80%', height: '70%'},
    legend: {position: 'bottom'},
    height: 400
  });
  
  // Show the chart
  chartPanel.clear();
  chartPanel.add(chart);
  
  // Add a button to return to the comparison panel
  var backButton = ui.Button({
    label: 'Πίσω στις αποθηκευμένες αναλύσεις',
    onClick: function() {
      updateComparisonUI();
    },
    style: {margin: '10px 0 0 0'}
  });
  chartPanel.add(backButton);
}

function createTransectHeatmap(data, dates, isWaterData, parameter, comparisonData) {
  if (!data || data.length === 0 || !data[0] || data[0].length === 0) {
    chartPanel.clear();
    chartPanel.add(ui.Label('Σφάλμα: Δεν βρέθηκαν έγκυρα δεδομένα για τη δημιουργία γραφήματος transect.'));
    return;
  }
  
  chartPanel.clear();
  chartPanel.add(ui.Label({
    value: 'Χωροχρονική Ανάλυση: ' + parameter.split(' - ')[0],
    style: {fontWeight: 'bold', fontSize: '16px', margin: '0 0 10px 0'}
  }));
  
  var vizParams = getVizParams(parameter);
  var basePalette, min, max;

  if (vizParams.isClassified) {
    basePalette = vizParams.palette;
    min = 0;
    max = vizParams.scale[vizParams.scale.length - 1];
  } else {
    basePalette = vizParams.basePalette || vizParams.palette;
    min = vizParams.min;
    max = vizParams.max;
  }
  
  var allValues = [];
  data.forEach(function(row, i) {
    var waterFlags = isWaterData[i];
    row.forEach(function(val, j) {
      if (val !== null && !isNaN(val) && waterFlags[j]) {
        allValues.push(val);
      }
    });
  });
  
  var minVal = allValues.length > 0 ? Math.min.apply(null, allValues) : min;
  var maxVal = allValues.length > 0 ? Math.max.apply(null, allValues) : max;
  
  var chartData = [];
  chartData.push(['Ημερομηνία', 'Θέση στη Γραμμή', {'role': 'style'}, {'role': 'tooltip'}]);
  
  var parameterName = parameter.split(' - ')[0];
  var fullPalette = generateSmoothPalette(basePalette, 100);

  for (var dateIdx = 0; dateIdx < dates.length; dateIdx++) {
    for (var pointIdx = 0; pointIdx < data[dateIdx].length; pointIdx++) {
      var value = data[dateIdx][pointIdx];
      var isWater = isWaterData[dateIdx][pointIdx];
      
      var color, styleString, tooltipString;

      if (isWater) {
        if (value !== null && !isNaN(value)) {
          var normalizedValue = Math.max(0, Math.min(1, (value - min) / (max - min)));
          var colorIndex = Math.floor(normalizedValue * (fullPalette.length - 1));
          color = fullPalette[colorIndex];
          tooltipString = 'Ημ/νία: ' + dates[dateIdx] + '\n' + 'Σημείο: ' + pointIdx + ' (Water)\n' + parameterName + ': ' + value.toFixed(3);
        } else {
          color = '#d1d5db';
          tooltipString = 'Ημ/νία: ' + dates[dateIdx] + '\n' + 'Σημείο: ' + pointIdx + ' (Water)\n' + parameterName + ': No Data';
        }
      } else {
        color = '#6b7280';
        tooltipString = 'Ημ/νία: ' + dates[dateIdx] + '\n' + 'Σημείο: ' + pointIdx + ' (Land)';
      }

      if (color) {
        styleString = 'point { size: 7; fill-color: ' + color + '; }';
        chartData.push([new Date(dates[dateIdx]), pointIdx, styleString, tooltipString]);
      }
    }
  }
  
  var scatterChart = ui.Chart(chartData, 'ScatterChart').setOptions({
      title: 'Τιμές κατά μήκος της γραμμής ανά ημερομηνία',
      hAxis: { title: 'Ημερομηνία', gridlines: { color: 'transparent' }, format: 'MMM dd'},
      vAxis: { title: 'Θέση στη γραμμή (σημείο #)', minValue: 0, maxValue: data[0].length - 1},
      legend: 'none', backgroundColor: '#f5f5f5', chartArea: {width: '70%', height: '70%'}, height: 400, pointSize: 7
  });
  chartPanel.add(scatterChart);
  
  var averageValuesData = [];
  var yAxisLabel = 'Μέση Τιμή (' + parameterName + ')';
  averageValuesData.push(['Date', yAxisLabel]);

  for (var i = 0; i < dates.length; i++) {
    var dailyValues = data[i], dailyWaterFlags = isWaterData[i], waterValues = [];
    for (var j = 0; j < dailyValues.length; j++) {
      if (dailyWaterFlags[j] && dailyValues[j] !== null && !isNaN(dailyValues[j])) {
        waterValues.push(dailyValues[j]);
      }
    }
    if (waterValues.length > 0) {
      var sum = waterValues.reduce(function(a, b) { return a + b; }, 0);
      var average = sum / waterValues.length;
      averageValuesData.push([new Date(dates[i]), average]);
    }
  }
  
  if (averageValuesData.length > 1) {
    var timeSeriesChart = ui.Chart(averageValuesData, 'LineChart').setOptions({
      title: 'Μέση Τιμή κατά μήκος της Γραμμής στο Χρόνο',
      vAxis: {title: yAxisLabel},
      hAxis: {title: 'Ημερομηνία', format: 'MMM dd'},
      height: 300, legend: 'none', colors: ['#1976D2'],
      series: { 0: { lineWidth: 2, pointSize: 4 } }
    });
    chartPanel.add(timeSeriesChart);
    
    if (currentAnalysisData) {
      currentAnalysisData.averageTimeSeries = averageValuesData.slice(1);
    }
  }

  var colorLegendPanel = ui.Panel({ layout: ui.Panel.Layout.flow('horizontal'), style: {margin: '10px 0', padding: '0px 8px'} });
  var colorBar = ui.Panel(
    generateSmoothPalette(basePalette, 30).map(function(c) {
      return ui.Label('', {backgroundColor: c, padding: '8px 3px', margin: '0'});
    }), ui.Panel.Layout.flow('horizontal')
  );
  
  colorLegendPanel.add(ui.Label(min.toFixed(2), {margin: '0 4px 0 0'}));
  colorLegendPanel.add(colorBar);
  colorLegendPanel.add(ui.Label(max.toFixed(2), {margin: '0 0 0 4px'}));
  chartPanel.add(ui.Label('Κλίμακα χρωμάτων (Νερό):', {fontWeight: 'bold'}));
  chartPanel.add(colorLegendPanel);
  
  var dateSelector = ui.Slider({ min: 0, max: dates.length - 1, value: 0, step: 1, style: {stretch: 'horizontal'}, onChange: function(index) { updateLineProfile(Math.round(index), dates, data, parameter); }});
  chartPanel.add(ui.Label('Επιλέξτε ημερομηνία για προφίλ γραμμής:', {fontWeight: 'bold', margin: '20px 0 5px 0'}));
  chartPanel.add(dateSelector);
  
  var lineProfilePanel = ui.Panel({style: {margin: '10px 0'}});
  chartPanel.add(lineProfilePanel);
  
  function updateLineProfile(dateIndex, dates, data, parameter) {
    lineProfilePanel.clear();
    var selectedDate = dates[dateIndex];
    var values = data[dateIndex];
    var lineData = [['Σημείο', parameter.split(' - ')[0]]];
    for (var i = 0; i < values.length; i++) {
      lineData.push([i, values[i]]);
    }
    
    var lineChart = ui.Chart(lineData, 'LineChart').setOptions({
        title: 'Προφίλ γραμμής για ' + selectedDate,
        hAxis: {title: 'Θέση στη γραμμή (σημείο #)'},
        vAxis: {title: parameter.split(' - ')[0], viewWindow: { min: min, max: max }},
        colors: ['#1976D2'], pointSize: 5, lineWidth: 2, height: 300
    });
    lineProfilePanel.add(lineChart);
  }
  
  updateLineProfile(0, dates, data, parameter);
  
  var statsPanel = ui.Panel({
    widgets: [
      ui.Label('Στατιστικά (μόνο για το νερό):', {fontWeight: 'bold'}),
      ui.Label('Ελάχιστο: ' + minVal.toFixed(3)),
      ui.Label('Μέγιστο: ' + maxVal.toFixed(3)),
      ui.Label('Εύρος: ' + (maxVal - minVal).toFixed(3)),
      ui.Label('Μέσος όρος: ' + (allValues.length > 0 ? (allValues.reduce(function(a,b){return a+b;}, 0) / allValues.length).toFixed(3) : 'N/A'))
    ],
    style: {margin: '10px 0'}
  });
  chartPanel.add(statsPanel);
  
  var exportButton = ui.Button({ label: 'Εξαγωγή δεδομένων CSV', onClick: function() { exportTransectData(data, dates, parameter); } });
  chartPanel.add(exportButton);
}

function exportTransectData(data, dates, parameter) {
  var header = 'Date';
  for (var i = 0; i < data[0].length; i++) {
    header += ',Point_' + (i + 1);
  }
  var csvContent = header + '\n';
  
  for (var i = 0; i < dates.length; i++) {
    csvContent += dates[i] + ',' + data[i].join(',') + '\n';
  }
  
  print('=== TRANSECT DATA EXPORT ===');
  print('Parameter: ' + parameter);
  print('Number of dates: ' + dates.length);
  print('Number of points: ' + (data[0] ? data[0].length : 0));
  print('Copy the data below to save as CSV:');
  print(csvContent);
  
  var features = [];
  for (var dateIndex = 0; dateIndex < dates.length; dateIndex++) {
    var properties = {date: dates[dateIndex]};
    for (var pointIndex = 0; pointIndex < data[dateIndex].length; pointIndex++) {
      properties['Point_' + (pointIndex + 1)] = data[dateIndex][pointIndex];
    }
    features.push(ee.Feature(null, properties));
  }
  
  var fc = ee.FeatureCollection(features);
  
  Export.table.toDrive({ collection: fc, description: 'transect_' + parameter.split(' - ')[0] + '_export', fileFormat: 'CSV' });
  print('Export task created! Check the Tasks tab to start the export.');
}

// --- 5. ΣΥΝΑΡΤΗΣΕΙΣ ΕΠΕΞΕΡΓΑΣΙΑΣ ---
function safeNormalizedDifference(image, band1, band2) {
  var b1 = image.select(band1);
  var b2 = image.select(band2);
  var numerator = b1.subtract(b2);
  var denominator = b1.add(b2).add(0.0001);
  return numerator.divide(denominator);
}

function processImage(image, parameter, applyMask) {
  var waterMask;
  var shouldApplyMask = (applyMask === false) ? false : true;

  if (parameter.indexOf('Temperature') > -1) {
    waterMask = image.select('QA_PIXEL').bitwiseAnd(1 << 7).gt(0);
  } else {
    // L1C values are integers, so divide by 10000 to get reflectance
    var toa = image.divide(10000);
    waterMask = safeNormalizedDifference(toa, 'B3', 'B8').gt(0);
  }
  
  var procImage = image.divide(10000); // Convert all bands to reflectance for calculations

  switch(parameter) {
    case 'Water Surface Temperature - Θερμοκρασία Επιφάνειας (°C)':
      return calculateWST(image, waterMask, shouldApplyMask); // Landsat is already scaled
    case 'True Color - Πραγματικό Χρώμα':
      return image.updateMask(waterMask); // Show raw RGB for True Color
    case 'NDWI - Δείκτης Νερού':
      var ndwiImage = safeNormalizedDifference(procImage, 'B3', 'B8').rename('NDWI');
      return shouldApplyMask ? ndwiImage.updateMask(waterMask) : ndwiImage;
    case 'GNIR - Λόγος Πράσινου/NIR':
      return calculateGNIR(procImage, waterMask, shouldApplyMask);
    case 'NDCI - Χλωροφύλλη':
      return calculateNDCI(procImage, waterMask, shouldApplyMask);
    case 'NDTI - Θολότητα':
      return calculateNDTI(procImage, waterMask, shouldApplyMask);
    case 'Chl-a (Se2WaQ) - Χλωροφύλλη-α':
      return calculateChla_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'Cya (Se2WaQ) - Κυανοβακτήρια':
      return calculateCya_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'Turb (Se2WaQ) - Θολότητα (NTU)':
      return calculateTurb_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'CDOM (Se2WaQ) - Οργανική Ύλη':
      return calculateCDOM_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'DOC (Se2WaQ) - Διαλυμένος Άνθρακας':
      return calculateDOC_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'Color (Se2WaQ) - Χρώμα Νερού':
      return calculateColor_Se2WaQ(procImage, waterMask, shouldApplyMask);
    default:
      return calculateNDCI(procImage, waterMask, shouldApplyMask);
  }
}

function getVizParams(parameter) {
  var defaultPalette = ['#0000FF', '#00FFFF', '#00FF00', '#FFFF00', '#FF0000'];
  var ndwiPalette = ['#8B4513', '#FFFF00', '#00FFFF', '#0000FF'];
  var tsmPalette = ['#0000FF', '#00FFFF', '#FFFF00', '#FF8000', '#FF0000'];
  var tempPalette = ['#000080', '#0000FF', '#00FFFF', '#FFFF00', '#FF0000', '#800000'];
  var se2waq_base_palette = ['#496FF2', '#82D35F', '#FEFD05', '#FD0004', '#8E2026', '#D97CF5'];
  var p;
  
  switch(parameter) {
    case 'Water Surface Temperature - Θερμοκρασία Επιφάνειας (°C)': p = {min: 5, max: 35, basePalette: tempPalette}; break;
    case 'True Color - Πραγματικό Χρώμα': return {bands: ['B4', 'B3', 'B2'], min: 0, max: 3000};
    case 'NDCI - Χλωροφύλλη': p = {min: -0.2, max: 0.6, basePalette: defaultPalette}; break;
    case 'NDTI - Θολότητα': p = {min: -0.2, max: 0.3, basePalette: tsmPalette}; break;
    case 'NDWI - Δείκτης Νερού': p = {min: -0.5, max: 0.8, basePalette: ndwiPalette}; break;
    case 'GNIR - Λόγος Πράσινου/NIR': p = {min: 1, max: 10, basePalette: defaultPalette}; break;
    
    // --- Se2WaQ Classified Parameters ---
   case 'Chl-a (Se2WaQ) - Χλωροφύλλη-α':
  p = {min: scaleChl_a[0], max: scaleChl_a[5], basePalette: se2waq_base_palette}; break;
case 'Cya (Se2WaQ) - Κυανοβακτήρια':
  p = {min: scaleCya[0], max: scaleCya[5], basePalette: se2waq_base_palette}; break;
case 'Turb (Se2WaQ) - Θολότητα (NTU)':
  p = {min: scaleTurb[0], max: scaleTurb[5], basePalette: se2waq_base_palette}; break;
case 'CDOM (Se2WaQ) - Οργανική Ύλη':
  p = {min: scaleCDOM[0], max: scaleCDOM[5], basePalette: se2waq_base_palette}; break;
case 'DOC (Se2WaQ) - Διαλυμένος Άνθρακας':
  p = {min: scaleDOC[0], max: scaleDOC[5], basePalette: se2waq_base_palette}; break;
case 'Color (Se2WaQ) - Χρώμα Νερού':
  p = {min: scaleColor[0], max: scaleColor[5], basePalette: se2waq_base_palette}; break;

    default: p = {min: 0, max: 1, basePalette: ['blue', 'green', 'red']}; break;
  }
  
  p.palette = generateSmoothPalette(p.basePalette, 100);
  p.isClassified = false;
  return p;
}


// --- 6. ΣΥΝΑΡΤΗΣΕΙΣ ΥΠΟΛΟΓΙΣΜΟΥ ΔΕΙΚΤΩΝ ---

function applyMaskConditional(image, mask, apply) {
    return apply ? image.updateMask(mask) : image;
}

// NOTE: All calculation functions now expect a TOA reflectance image (0-1 range)
function calculateWST(image, waterMask, applyMask) {
  var thermalBand = image.select('ST_B10');
  var tempC = thermalBand.multiply(0.00341802).add(149.0).subtract(273.15).rename('WST');
  return applyMaskConditional(tempC, waterMask, applyMask);
}

function calculateNDCI(image, waterMask, applyMask) {
  var result = safeNormalizedDifference(image, 'B5', 'B4').rename('NDCI');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateNDTI(image, waterMask, applyMask) {
  var result = safeNormalizedDifference(image, 'B4', 'B3').rename('NDTI');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateGNIR(image, waterMask, applyMask) {
  var b8_safe = image.select('B8').add(0.0001);
  var result = image.select('B3').divide(b8_safe).rename('GNIR');
  return applyMaskConditional(result, waterMask, applyMask);
}

// --- Se2WaQ CALCULATION FUNCTIONS (Now using reflectance input) ---
// WARNING: L2A-based models will be inaccurate.
function calculateChla_Se2WaQ(image, waterMask, applyMask) {
  var b1_safe = image.select('B1').add(0.0001);
  var ratio = image.select('B3').divide(b1_safe);
  var result = ee.Image(4.26).multiply(ratio.pow(3.94)).rename('Chla_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateCya_Se2WaQ(image, waterMask, applyMask) {
  var b2_safe = image.select('B2').add(0.0001);
  var ratio = image.select('B3').multiply(image.select('B4')).divide(b2_safe);
  var result = ee.Image(115530.31).multiply(ratio.pow(2.38)).rename('Cya_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateTurb_Se2WaQ(image, waterMask, applyMask) {
  var b1_safe = image.select('B1').add(0.0001);
  var ratio = image.select('B3').divide(b1_safe);
  var result = ee.Image(8.93).multiply(ratio).subtract(6.39).rename('Turb_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

// L1C-based models. These should be more accurate.
function calculateCDOM_Se2WaQ(image, waterMask, applyMask) {
  var b4_safe = image.select('B4').add(0.0001);
  var ratio = image.select('B3').divide(b4_safe);
  var result = ee.Image(537).multiply(ee.Image(-2.93).multiply(ratio).exp()).rename('CDOM_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateDOC_Se2WaQ(image, waterMask, applyMask) {
  var b4_safe = image.select('B4').add(0.0001);
  var ratio = image.select('B3').divide(b4_safe);
  var result = ee.Image(432).multiply(ee.Image(-2.24).multiply(ratio).exp()).rename('DOC_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateColor_Se2WaQ(image, waterMask, applyMask) {
  var b4_safe = image.select('B4').add(0.0001);
  var ratio = image.select('B3').divide(b4_safe);
  var result = ee.Image(25366).multiply(ee.Image(-4.53).multiply(ratio).exp()).rename('Color_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}


