function createOverlayComparison(result1, result2, targetPanel) {
  targetPanel.clear();
  
  var data1 = extractTimeSeriesData(result1);
  var data2 = extractTimeSeriesData(result2);
  
  if (!data1 || !data2) {
    targetPanel.add(ui.Label('❌ Δεν ήταν δυνατή η εξαγωγή δεδομένων!', {color: 'red'}));
    return;
  }
  
  // Normalize data to 0-1 range for overlay
  var normalizedData1 = normalizeData(data1);
  var normalizedData2 = normalizeData(data2);
  
  var chartData = [['Date', result1.data.parameter.split(' - ')[0] + ' (normalized)', result2.data.parameter.split(' - ')[0] + ' (normalized)']];
  
  // Merge normalized data
  var mergedData = {};
  normalizedData1.forEach(function(point) {
    mergedData[point.date] = {date: point.date, value1: point.value};
  });
  
  normalizedData2.forEach(function(point) {
    if (mergedData[point.date]) {
      mergedData[point.date].value2 = point.value;
    }
  });
  
  Object.values(mergedData).forEach(function(point) {
    if (point.value1 !== undefined && point.value2 !== undefined) {
      chartData.push([new Date(point.date), point.value1, point.value2]);
    }
  });
  
  var overlayChart = ui.Chart(chartData, 'LineChart').setOptions({
    title: 'Normalized Overlay Comparison',
    hAxis: {title: 'Date', format: 'MMM dd'},
    vAxis: {title: 'Normalized Value (0-1)', minValue: 0, maxValue: 1},
    series: {
      0: {color: '#1976D2', lineWidth: 2, pointSize: 3},
      1: {color: '#D32F2F', lineWidth: 2, pointSize: 3}
    },
    height: 400,
    backgroundColor: '#f5f5f5'
  });
  
  targetPanel.add(overlayChart);
}

function extractTimeSeriesData(result) {
  var data = result.data;
  
  if (data.type === 'transect' && data.averageTimeSeries) {
    return data.averageTimeSeries.map(function(point) {
      return {
        date: point[0].toISOString().substring(0, 10), // Convert to YYYY-MM-DD
        value: point[1]
      };
    });
  } else if (data.type === 'lakeHeight' && data.timeSeriesData) {
    return data.timeSeriesData.map(function(point) {
      return {
        date: point.date,
        value: point.waterLevel || point.area || point.elevation
      };
    });
  }
  
  return null;
}

function normalizeData(data) {
  if (!data || data.length === 0) return [];
  
  var values = data.map(function(point) { return point.value; });
  var min = Math.min.apply(null, values);
  var max = Math.max.apply(null, values);
  var range = max - min;
  
  if (range === 0) return data; // Avoid division by zero
  
  return data.map(function(point) {
    return {
      date: point.date,
      value: (point.value - min) / range
    };
  });
}

function calculateCorrelation(data1, data2) {
  if (!data1 || !data2 || data1.length === 0 || data2.length === 0) return null;
  
  // Create date-matched pairs
  var pairs = [];
  data1.forEach(function(point1) {
    var match = data2.find(function(point2) {
      return point2.date === point1.date;
    });
    if (match) {
      pairs.push([point1.value, match.value]);
    }
  });
  
  if (pairs.length < 2) return null;
  
  var n = pairs.length;
  var sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
  
  pairs.forEach(function(pair) {
    sumX += pair[0];
    sumY += pair[1];
    sumXY += pair[0] * pair[1];
    sumX2 += pair[0] * pair[0];
    sumY2 += pair[1] * pair[1];
  });
  
  var numerator = n * sumXY - sumX * sumY;
  var denominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));
  
  return denominator === 0 ? 0 : numerator / denominator;
}

