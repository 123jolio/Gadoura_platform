// --- 8. LAKE HEIGHT ANALYSIS FUNCTIONS (Adapted for L1C) ---
function maskCloudsAndShadows_Lake(image) {
  var qa = image.select('QA60');
  var cloudBitMask = 1 << 10;
  var cirrusBitMask = 1 << 11;
  var mask = qa.bitwiseAnd(cloudBitMask).eq(0).and(qa.bitwiseAnd(cirrusBitMask).eq(0));
  return image.updateMask(mask);
}

function runLakeHeightAnalysis(lakeRegion, startDate, endDate) {
  chartPanel.clear();
  chartPanel.style().set('shown', true);
  mapPanel.style().set('width', '70%');
  chartPanel.add(ui.Label('🔄 Επεξεργασία δεδομένων υψομέτρου... Παρακαλώ περιμένετε...', {fontWeight: 'bold', color: '#1e40af'}));
  map.layers().reset();
  
  var cloudThreshold = lakeCloudSlider.getValue();
  var ndwiThreshold = lakeNdwiSlider.getValue();
  var method = lakeMethodSelect.getValue();
  var showDebug = lakeDebugCheckbox.getValue();
  var useCloudMasking = lakePreprocessCheckbox.getValue();
  var useComposite = lakeCompositeCheckbox.getValue();
  
  var dem = ee.ImageCollection('COPERNICUS/DEM/GLO30').select('DEM').mosaic();
  var s2 = ee.ImageCollection('COPERNICUS/S2_HARMONIZED')
    .filterDate(startDate, endDate).filterBounds(lakeRegion)
    .filter(ee.Filter.lt('CLOUDY_PIXEL_PERCENTAGE', cloudThreshold))
    .select(['B2', 'B3', 'B4', 'B8', 'B11', 'B12', 'QA60']);
  
  if (useCloudMasking) { s2 = s2.map(maskCloudsAndShadows_Lake); }
  
  s2.size().evaluate(function(collectionSize) {
    if (collectionSize === 0) {
      chartPanel.clear();
      chartPanel.add(ui.Label('❌ Δεν βρέθηκαν εικόνες Sentinel-2!', {color: 'red', fontWeight: 'bold'}));
      chartPanel.add(ui.Label('Προτάσεις:\n• Επεκτείνετε το χρονικό εύρος\n• Αυξήστε το όριο νεφοκάλυψης\n• Ελέγξτε αν το Sentinel-2 καλύπτει αυτή την περιοχή', {whiteSpace: 'pre-wrap', fontSize: '12px'}));
      return;
    }
    if (showDebug) { chartPanel.add(ui.Label('📊 Βρέθηκαν ' + collectionSize + ' εικόνες Sentinel-2 L1C', {fontSize: '11px', color: 'gray'})); }
    
    if (useComposite) {
      processWithCompositesLake(s2, dem, lakeRegion, method, ndwiThreshold, showDebug);
    } else {
      processIndividualImagesLake(s2, dem, lakeRegion, method, ndwiThreshold, showDebug);
    }
  });
}

function getWaterMask_Lake(image, method, threshold) {
  var toa = image.divide(10000);
  
  switch(method) {
    case 'NDWI Standard':
      return safeNormalizedDifference(toa, 'B3', 'B8').gt(threshold);
    case 'MNDWI Enhanced':
      return safeNormalizedDifference(toa, 'B3', 'B11').gt(threshold);
    case 'AWEInsh':
      var awei = toa.select('B2').multiply(4).subtract(toa.select('B8').multiply(0.25)).subtract(toa.select('B11').multiply(2.75));
      return awei.gt(threshold);
    case 'Simple Threshold':
      return toa.select('B8').lt(0.1);
    case 'Multi-Index Fusion':
      var ndwi = safeNormalizedDifference(toa, 'B3', 'B8');
      var mndwi = safeNormalizedDifference(toa, 'B3', 'B11');
      return ndwi.gt(threshold).and(mndwi.gt(threshold));
    default: // Auto (Best)
      var ndwi = safeNormalizedDifference(toa, 'B3', 'B8');
      var mndwi = safeNormalizedDifference(toa, 'B3', 'B11');
      return ndwi.gt(0).or(mndwi.gt(0));
  }
}

function processIndividualImagesLake(collection, dem, region, method, threshold, showDebug) {
  var results = collection.map(function(image) {
    var date = ee.Date(image.get('system:time_start'));
    var waterMask = getWaterMask_Lake(image, method, threshold);
    var waterArea = waterMask.multiply(ee.Image.pixelArea()).reduceRegion({
      reducer: ee.Reducer.sum(),
      geometry: region,
      scale: 30,
      maxPixels: 1e9
    });
    
    var waterElevation = dem.updateMask(waterMask).reduceRegion({
      reducer: ee.Reducer.mean(),
      geometry: region,
      scale: 30,
      maxPixels: 1e9
    });
    
    return ee.Feature(null, {
      date: date.format('YYYY-MM-dd'),
      area: waterArea.get('classification'),
      elevation: waterElevation.get('DEM')
    });
  });
  
  results.evaluate(function(featureList) {
    if (showDebug) {
      chartPanel.add(ui.Label('📊 Επεξεργάστηκαν ' + featureList.length + ' εικόνες', {fontSize: '11px', color: 'gray'}));
    }
    
    var timeSeriesData = featureList.map(function(feature) {
      return {
        date: feature.properties.date,
        area: feature.properties.area,
        elevation: feature.properties.elevation
      };
    }).filter(function(item) {
      return item.area !== null && item.elevation !== null;
    });
    
    currentAnalysisData = {
      type: 'lakeHeight',
      parameter: 'Lake Height Analysis',
      timeSeriesData: timeSeriesData,
      geometry: region
    };
    
    displayLakeHeightResults(timeSeriesData, showDebug);
    
    saveResultButton.style().set('shown', true);
    
    // Auto-save if comparison mode is on
    if (comparisonMode) {
      saveCurrentResult();
    }
  });
}

function processWithCompositesLake(collection, dem, region, method, threshold, showDebug) {
  var months = ee.List.sequence(1, 12);
  var years = ee.List.sequence(2017, 2024);
  
  var monthlyComposites = years.map(function(year) {
    return months.map(function(month) {
      var monthlyImages = collection
        .filter(ee.Filter.calendarRange(year, year, 'year'))
        .filter(ee.Filter.calendarRange(month, month, 'month'));
      
      var composite = monthlyImages.median();
      var date = ee.Date.fromYMD(year, month, 15);
      
      return composite.set('system:time_start', date.millis());
    });
  }).flatten();
  
  var compositeCollection = ee.ImageCollection.fromImages(monthlyComposites);
  processIndividualImagesLake(compositeCollection, dem, region, method, threshold, showDebug);
}

function displayLakeHeightResults(timeSeriesData, showDebug) {
  chartPanel.clear();
  chartPanel.add(ui.Label('📊 Αποτελέσματα Ανάλυσης Υψομέτρου Λίμνης', {
    fontWeight: 'bold',
    fontSize: '16px',
    margin: '0 0 15px 0'
  }));
  
  if (!timeSeriesData || timeSeriesData.length === 0) {
    chartPanel.add(ui.Label('❌ Δεν βρέθηκαν έγκυρα δεδομένα για την ανάλυση υψομέτρου!', {
      color: 'red',
      fontWeight: 'bold'
    }));
    return;
  }
  
  // Water Level Chart
  var waterLevelData = [['Date', 'Water Level (m)']];
  timeSeriesData.forEach(function(point) {
    if (point.elevation !== null && !isNaN(point.elevation)) {
      waterLevelData.push([new Date(point.date), point.elevation]);
    }
  });
  
  if (waterLevelData.length > 1) {
    var waterLevelChart = ui.Chart(waterLevelData, 'LineChart').setOptions({
      title: 'Υψόμετρο Στάθμης Νερού στον Χρόνο',
      hAxis: {title: 'Ημερομηνία', format: 'MMM yyyy'},
      vAxis: {title: 'Υψόμετρο (m)'},
      colors: ['#1976D2'],
      height: 300,
      pointSize: 4,
      lineWidth: 2,
      backgroundColor: '#f5f5f5'
    });
    chartPanel.add(waterLevelChart);
  }
  
  // Water Area Chart
  var waterAreaData = [['Date', 'Water Area (km²)']];
  timeSeriesData.forEach(function(point) {
    if (point.area !== null && !isNaN(point.area)) {
      var areaKm2 = point.area / 1000000; // Convert from m² to km²
      waterAreaData.push([new Date(point.date), areaKm2]);
    }
  });
  
  if (waterAreaData.length > 1) {
    var waterAreaChart = ui.Chart(waterAreaData, 'LineChart').setOptions({
      title: 'Επιφάνεια Νερού στον Χρόνο',
      hAxis: {title: 'Ημερομηνία', format: 'MMM yyyy'},
      vAxis: {title: 'Επιφάνεια (km²)'},
      colors: ['#D32F2F'],
      height: 300,
      pointSize: 4,
      lineWidth: 2,
      backgroundColor: '#f5f5f5'
    });
    chartPanel.add(waterAreaChart);
  }
  
  // Combined dual-axis chart
  if (waterLevelData.length > 1 && waterAreaData.length > 1) {
    var combinedData = [['Date', 'Water Level (m)', 'Water Area (km²)']];
    var dataMap = {};
    
    // Merge data by date
    waterLevelData.slice(1).forEach(function(point) {
      var dateStr = point[0].toISOString().substring(0, 10);
      dataMap[dateStr] = {date: point[0], level: point[1]};
    });
    
    waterAreaData.slice(1).forEach(function(point) {
      var dateStr = point[0].toISOString().substring(0, 10);
      if (dataMap[dateStr]) {
        dataMap[dateStr].area = point[1];
      } else {
        dataMap[dateStr] = {date: point[0], area: point[1]};
      }
    });
    
    Object.values(dataMap).forEach(function(point) {
      combinedData.push([point.date, point.level || null, point.area || null]);
    });
    
    var combinedChart = ui.Chart(combinedData, 'LineChart').setOptions({
      title: 'Υψόμετρο και Επιφάνεια Νερού (Dual-Axis)',
      hAxis: {title: 'Ημερομηνία', format: 'MMM yyyy'},
      vAxes: {
        0: {title: 'Υψόμετρο (m)', color: '#1976D2'},
        1: {title: 'Επιφάνεια (km²)', color: '#D32F2F'}
      },
      series: {
        0: {targetAxisIndex: 0, color: '#1976D2', lineWidth: 2, pointSize: 4},
        1: {targetAxisIndex: 1, color: '#D32F2F', lineWidth: 2, pointSize: 4}
      },
      height: 350,
      backgroundColor: '#f5f5f5'
    });
    chartPanel.add(combinedChart);
  }
  
  // Statistics panel
  var levels = timeSeriesData.map(function(d) { return d.elevation; }).filter(function(v) { return v !== null && !isNaN(v); });
  var areas = timeSeriesData.map(function(d) { return d.area; }).filter(function(v) { return v !== null && !isNaN(v); });
  
  if (levels.length > 0 || areas.length > 0) {
    var statsPanel = ui.Panel({
      style: {
        margin: '15px 0',
        padding: '10px',
        backgroundColor: '#f8f9fa',
        border: '1px solid #ddd'
      }
    });
    
    statsPanel.add(ui.Label('📈 Στατιστικά Αποτελέσματα:', {
      fontWeight: 'bold',
      margin: '0 0 10px 0'
    }));
    
    if (levels.length > 0) {
      var minLevel = Math.min.apply(null, levels);
      var maxLevel = Math.max.apply(null, levels);
      var avgLevel = levels.reduce(function(a, b) { return a + b; }, 0) / levels.length;
      var levelRange = maxLevel - minLevel;
      
      statsPanel.add(ui.Label('🌊 Υψόμετρο Νερού:', {fontWeight: 'bold', margin: '5px 0'}));
      statsPanel.add(ui.Label('   • Ελάχιστο: ' + minLevel.toFixed(2) + ' m', {fontSize: '12px'}));
      statsPanel.add(ui.Label('   • Μέγιστο: ' + maxLevel.toFixed(2) + ' m', {fontSize: '12px'}));
      statsPanel.add(ui.Label('   • Μέσος όρος: ' + avgLevel.toFixed(2) + ' m', {fontSize: '12px'}));
      statsPanel.add(ui.Label('   • Εύρος διακύμανσης: ' + levelRange.toFixed(2) + ' m', {fontSize: '12px'}));
    }
    
    if (areas.length > 0) {
      var areasKm2 = areas.map(function(a) { return a / 1000000; });
      var minArea = Math.min.apply(null, areasKm2);
      var maxArea = Math.max.apply(null, areasKm2);
      var avgArea = areasKm2.reduce(function(a, b) { return a + b; }, 0) / areasKm2.length;
      var areaRange = maxArea - minArea;
      
      statsPanel.add(ui.Label('🏊 Επιφάνεια Νερού:', {fontWeight: 'bold', margin: '10px 0 5px 0'}));
      statsPanel.add(ui.Label('   • Ελάχιστη: ' + minArea.toFixed(2) + ' km²', {fontSize: '12px'}));
      statsPanel.add(ui.Label('   • Μέγιστη: ' + maxArea.toFixed(2) + ' km²', {fontSize: '12px'}));
      statsPanel.add(ui.Label('   • Μέση: ' + avgArea.toFixed(2) + ' km²', {fontSize: '12px'}));
      statsPanel.add(ui.Label('   • Εύρος διακύμανσης: ' + areaRange.toFixed(2) + ' km²', {fontSize: '12px'}));
    }
    
    statsPanel.add(ui.Label('📊 Σύνολο παρατηρήσεων: ' + timeSeriesData.length, {
      fontWeight: 'bold',
      margin: '10px 0 0 0'
    }));
    
    chartPanel.add(statsPanel);
  }
  
  // Export functionality
  var exportButton = ui.Button({
    label: '📁 Εξαγωγή Δεδομένων CSV',
    onClick: function() {
      exportLakeHeightData(timeSeriesData);
    },
    style: {
      stretch: 'horizontal',
      backgroundColor: '#17a2b8',
      color: 'white',
      margin: '10px 0'
    }
  });
  chartPanel.add(exportButton);
  
  if (showDebug) {
    chartPanel.add(ui.Label('✅ Ανάλυση υψομέτρου λίμνης ολοκληρώθηκε!', {
      color: 'green',
      fontWeight: 'bold',
      margin: '15px 0 0 0'
    }));
  }
}

function exportLakeHeightData(timeSeriesData) {
  try {
    // Check if timeSeriesData is valid
    if (!timeSeriesData || !Array.isArray(timeSeriesData) || timeSeriesData.length === 0) {
      print('Error: No data available for export');
      return;
    }
    
    // Convert the time series data to a FeatureCollection
    var features = [];
    
    for (var i = 0; i < timeSeriesData.length; i++) {
      var point = timeSeriesData[i];
      if (!point) continue;
      
      var areaKm2 = point.area ? (point.area / 1000000) : null;
      var elevation = point.elevation || null;
      
      // Only add valid data points
      if (point.date && (elevation !== null || areaKm2 !== null)) {
        var feature = ee.Feature(null, {
          'date': point.date,
          'water_level_m': elevation,
          'water_area_km2': areaKm2
        });
        features.push(feature);
      }
    }
    
    if (features.length === 0) {
      print('Error: No valid data points to export');
      return;
    }
    
    var featureCollection = ee.FeatureCollection(features);
    
    // Export the data to Google Drive
    var filename = 'lake_height_data_' + ee.Date(Date.now()).format('yyyy-MM-dd').getInfo();
    
    Export.table.toDrive({
      collection: featureCollection,
      description: 'LakeHeightExport',
      fileNamePrefix: filename,
      fileFormat: 'CSV',
      selectors: ['date', 'water_level_m', 'water_area_km2']
    });
    
    print('=== LAKE HEIGHT DATA EXPORT ===');
    print('Number of observations: ' + features.length);
    print('Export task started. Check the Tasks tab to run the export.');
    
  } catch (error) {
    print('Error in exportLakeHeightData:', error);
    throw error;
  }
}