  '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd',
  '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'
];
var nextColorIndex = 0;

// Maximum number of coordinate sets that can be selected
var MAX_SELECTED_TRANSECTS = 3;

// Helper function to generate a random color
function getNextColor() {
  var color = transectColors[nextColorIndex % transectColors.length];
  nextColorIndex++;
  return color;
}

// Create a new transect and add it to the store
function createTransect(coords, name, isActive) {
  var transectId = 'transect_' + Date.now();
  var transect = {
    id: transectId,
    name: name || 'Transect ' + (Object.keys(transectStore).length + 1),
    coords: coords,
    visible: true,
    color: getNextColor(),
    layer: null,
    analysis: null,
    isSelected: false
  };
  
  transectStore[transectId] = transect;
  if (isActive !== false) {
    setActiveTransect(transectId);
  }
  updateTransectDisplay();
  updateTransectList();
  return transectId;
}

// Set the active transect
function setActiveTransect(transectId) {
  if (transectStore[transectId]) {
    activeTransectId = transectId;
    // Update UI to reflect active transect
    updateTransectList();
    return true;
  }
  return false;
}

// Update transect coordinates
function updateTransect(transectId, coords, name) {
  if (transectStore[transectId]) {
    var transect = transectStore[transectId];
    transect.coords = coords || transect.coords;
    transect.name = name || transect.name;
    updateTransectDisplay();
    updateTransectList();
    return true;
  }
  return false;
}

// Toggle transect visibility
function toggleTransectVisibility(transectId) {
  if (transectStore[transectId]) {
    transectStore[transectId].visible = !transectStore[transectId].visible;
    updateTransectDisplay();
    updateTransectList();
    return true;
  }
  return false;
}

// Remove a transect
function removeTransect(transectId) {
  if (transectStore[transectId]) {
    // Remove the layer if it exists
    if (transectStore[transectId].layer) {
      map.layers().reset(map.layers().get(0)); // Reset to just the base layer
    }
    
    // Remove from store
    delete transectStore[transectId];
    
    // Update active transect if needed
    if (activeTransectId === transectId) {
      var remaining = Object.keys(transectStore);
      activeTransectId = remaining.length > 0 ? remaining[0] : null;
    }
    
    updateTransectDisplay();
    updateTransectList();
    return true;
  }
  return false;
}

// Update the map display with visible transects
function updateTransectDisplay() {
  // Clear all transect layers
  var layers = map.layers();
  while (layers.length() > 1) {
    layers.remove(layers.get(1));
  }
  
  // Add visible transects
  Object.values(transectStore).forEach(function(transect) {
    if (transect.visible) {
      var line = ee.Geometry.LineString(transect.coords);
      var points = transect.coords.map(function(coord, i) {
        return ee.Feature(ee.Geometry.Point(coord), {index: i});
      });
      
      // Add line
      map.addLayer(line, {color: transect.color}, transect.name + ' Line');
      
      // Add points
      map.addLayer(
        ee.FeatureCollection(points),
        {color: transect.color},
        transect.name + ' Points'
      );
    }
  });
}

// Update the transect list UI
function updateTransectList(selectedParam) {
  if (!transectListPanel) {
    transectListPanel = ui.Panel({
      layout: ui.Panel.Layout.flow('vertical'),
      style: {margin: '10px', padding: '5px'}
    });
    
    // Add header
    var header = ui.Panel([
      ui.Label('', {width: '24px'}), // Checkbox column
      ui.Label('Transect', {fontWeight: 'bold', width: '80px'}),
      ui.Label('Status', {fontWeight: 'bold', width: '120px'}),
      ui.Label('Points', {fontWeight: 'bold', width: '60px'})
    ], 'flow', {stretch: 'horizontal', alignItems: 'center'});
    
    // Add new transect button
    var addButton = ui.Button('+', function() { 
      startDrawingTransect();
    }, null, {stretch: 'horizontal', margin: '0 0 0 10px'});
    
    var headerPanel = ui.Panel([
      ui.Panel([], 'flow', {width: '24px'}),
      ui.Label('Transects', {fontWeight: 'bold', width: '80px'}),
      addButton
    ], 'flow', {stretch: 'horizontal', alignItems: 'center'});
    
    transectListPanel.add(header);
    transectListPanel.add(headerPanel);
  } else {
    // Clear existing items except headers
    while (transectListPanel.widgets().length > 2) {
      transectListPanel.remove(transectListPanel.get(2));
    }
  }
  
  // Add transect items
  var transectCount = 0;
  var transectIds = Object.keys(transectStore);
  
  // Sort transects by creation time (newest first)
  transectIds.sort(function(a, b) {
    return new Date(transectStore[b].createdAt) - new Date(transectStore[a].createdAt);
  });
  
  transectIds.forEach(function(transectId) {
    var transect = transectStore[transectId];
    if (!transect) return;
    
    var statusText = '';
    if (transect.processing) {
      statusText = 'Processing...';
    } else if (transect.status === 'Complete') {
      statusText = 'Complete';
    } else if (transect.status === 'Error') {
      statusText = 'Error: ' + (transect.error || 'Unknown error');
    } else {
      statusText = 'Ready';
    }
    
    var checkbox = ui.Checkbox({
      value: selectedTransectIds.includes(transectId),
      onChange: function(checked) {
        if (checked) {
          if (selectedTransectIds.length < 3) {
            selectedTransectIds.push(transectId);
          } else {
            // If already at max, uncheck and show message
            checkbox.setValue(false, true);
            print('Maximum of 3 transects can be selected for comparison');
            return;
          }
        } else {
          var index = selectedTransectIds.indexOf(transectId);
          if (index > -1) {
            selectedTransectIds.splice(index, 1);
          }
        }
        updateTransectList(selectedParam);
      },
      disabled: transect.processing
    });
    
    var row = ui.Panel([
      ui.Panel([checkbox], 'flow', {width: '24px'}),
      ui.Label(transect.name || ('Transect ' + transectId), {
        width: '80px',
        fontWeight: transectId === activeTransectId ? 'bold' : 'normal',
        color: transectId === activeTransectId ? 'blue' : 'black',
        cursor: 'pointer'
      }),
      ui.Label(statusText, {width: '120px', color: transect.status === 'Error' ? 'red' : 'black'}),
      ui.Label(transect.points ? transect.points.size().getInfo() : '0', {width: '60px'}),
      ui.Button('✕', function() {
        // Remove transect
        if (transect.geometry) {
          // Remove from map if exists
          var layers = Map.layers();
          for (var i = 0; i < layers.length; i++) {
            if (layers[i].get('id') === 'transect_' + transectId) {
              Map.layers().remove(layers[i]);
              break;
            }
          }
        }
        delete transectStore[transectId];
        updateTransectList(selectedParam);
      }, null, {stretch: 'horizontal'})
    ], 'flow', {stretch: 'horizontal', alignItems: 'center', margin: '2px 0'});
    
    // Add click handler to the label for activation
    row.get(1).onClick(function() {
      // Toggle active state
      activeTransectId = transectId === activeTransectId ? null : transectId;
      updateTransectList(selectedParam);
      
      // Zoom to transect if not active
      if (transectId === activeTransectId && transect.geometry) {
        Map.centerObject(transect.geometry, 12);
      }
    });
    
    transectListPanel.add(row);
    transectCount++;
  });
  
  // Update save selected button state
  if (saveSelectedButton) {
    saveSelectedButton.setDisabled(selectedTransectIds.length === 0);
  }
  
  // Make sure the panel is added to the UI
  if (!transectListPanel.isInRootPanel()) {
    ui.root.widgets().set(1, transectListPanel);
  }
}

// Initialize drawing tools for transects
function initDrawingTools() {
  if (drawingTools) {
    map.setControlVisibility({
      all: false,
      zoomControl: true,
      mapTypeControl: true
    });
    return;
  }
  
  drawingTools = map.drawingTools();
  
  // Clear any existing layers
  drawingTools.layers().reset([]);
  
  // Add line drawing tool
  var lineString = ui.Map.DrawingTools.LineString({
    color: 'FF0000',
    width: 2,
    pointShape: 'circle',
    pointSize: 3,
    pointColor: 'FF0000',
    pointFill: 0.5,
    pointOutlineWidth: 1,
    pointOutlineColor: 'FFFFFF'
  });
  
  drawingTools.add(lineString);
  
  // Handle drawing complete
  drawingTools.onDraw(function(geometry) {
    if (geometry) {
      var coords = geometry.coordinates();
      createTransect(coords);
      drawingTools.clear();
    }
  });
  
  // Show the drawing tools
  drawingTools.setShown(true);
}

// Start drawing a new transect
function startDrawingTransect() {
  initDrawingTools();
  // Clear any existing drawing
  if (drawingTools) {
    drawingTools.clear();
    drawingTools.setShape('line');
  }
}

// Show comparison of multiple transects
function showTransectComparison(transectId, parameter) {
  if (!transectId || !transectStore[transectId] || !transectStore[transectId].analysis) {
    print('Error: Invalid transect or no analysis data available');
    return;
  }
  
  var currentTransect = transectStore[transectId];
  var currentAnalysis = currentTransect.analysis;
  
  // Create a panel for the comparison
  var comparisonPanel = ui.Panel({
    layout: ui.Panel.Layout.flow('vertical'),
    style: {stretch: 'both', padding: '10px'}
  });
  
  // Add a title
  comparisonPanel.add(ui.Label('Σύγκριση Γραμμών', {fontWeight: 'bold', fontSize: '16px'}));
  
  // Create a panel for the chart
  var chartContainer = ui.Panel({
    style: {height: '400px'}
  });
  
  // Create a panel for the legend
  var legendContainer = ui.Panel({
    layout: ui.Panel.Layout.flow('vertical'),
    style: {margin: '10px 0'}
  });
  
  // Initialize chart data
  var chartData = [['Date', 'Value', {'type': 'string', 'role': 'style'}, {'type': 'string', 'role': 'tooltip'}]];
  var transectIds = [transectId];
  
  // Add the current transect to the comparison
  addTransectToComparison(currentTransect, chartData);
  
  // Add checkboxes for other transects
  var transectList = ui.Panel({
    layout: ui.Panel.Layout.flow('vertical'),
    style: {margin: '10px 0'}
  });
  
  transectList.add(ui.Label('Επιλέξτε γραμμές για σύγκριση:', {fontWeight: 'bold'}));
  
  // Add checkboxes for other transects with analyses
  Object.values(transectStore).forEach(function(transect) {
    if (transect.id !== transectId && transect.analysis && transect.analysis.parameter === parameter) {
      var checkbox = ui.Checkbox({
        label: transect.name,
        value: false,
        onChange: function(checked) {
          if (checked) {
            transectIds.push(transect.id);
            addTransectToComparison(transect, chartData);
          } else {
            var index = transectIds.indexOf(transect.id);
            if (index > -1) {
              transectIds.splice(index, 1);
              updateComparisonChart(chartData, transectIds, chartContainer, legendContainer, parameter);
            }
          }
          updateComparisonChart(chartData, transectIds, chartContainer, legendContainer, parameter);
        }
      });
      
      var colorBox = ui.Label('⬛', {color: transect.color, margin: '0 5px 0 0'});
      var item = ui.Panel([colorBox, checkbox], ui.Panel.Layout.flow('horizontal'));
      transectList.add(item);
    }
  });
  
  // Add the chart and controls to the panel
  comparisonPanel.add(chartContainer);
  comparisonPanel.add(legendContainer);
  comparisonPanel.add(transectList);
  
  // Add a close button
  var closeButton = ui.Button({
    label: 'Κλείσιμο Σύγκρισης',
    onClick: function() {
      // Return to the original view
      chartPanel.clear();
      createTransectHeatmap(
        currentAnalysis.data,
        currentAnalysis.dates,
        currentAnalysis.isWaterData,
        currentAnalysis.parameter,
        currentTransect
      );
    },
    style: {stretch: 'horizontal'}
  });
  
  comparisonPanel.add(closeButton);
  
  // Clear the chart panel and show the comparison
  chartPanel.clear();
  chartPanel.add(comparisonPanel);
  
  // Initial chart update
  updateComparisonChart(chartData, transectIds, chartContainer, legendContainer, parameter);
  
  // Helper function to add a transect to the comparison data
  function addTransectToComparison(transect, chartData) {
    var analysis = transect.analysis;
    var color = transect.color;
    
    analysis.dates.forEach(function(dateStr, i) {
      var date = new Date(dateStr);
      var values = analysis.data[i];
      var waterFlags = analysis.isWaterData[i];
      
      // Calculate average value for water points
      var sum = 0;
      var count = 0;
      
      for (var j = 0; j < values.length; j++) {
        if (waterFlags[j] && values[j] !== null && !isNaN(values[j])) {
          sum += values[j];
          count++;
        }
      }
      
      if (count > 0) {
        var avg = sum / count;
        var tooltip = transect.name + '\n' + 
                     'Ημ/νία: ' + dateStr + '\n' +
                     'Μέση τιμή: ' + avg.toFixed(3);
        
        chartData.push([date, avg, 'point { size: 7; fill-color: ' + color + '; }', tooltip]);
      }
    });
  }
  
  // Function to update the comparison chart
  function updateComparisonChart(chartData, transectIds, container, legendContainer, parameter) {
    // Filter chart data to only include selected transects
    var filteredData = [chartData[0]]; // Keep headers
    
    for (var i = 1; i < chartData.length; i++) {
      var transectId = transectIds.find(function(id) {
        return chartData[i][3].includes(transectStore[id].name);
      });
      
      if (transectId) {
        filteredData.push(chartData[i]);
      }
    }
    
    // Clear the container
    container.clear();
    
    if (filteredData.length <= 1) {
      container.add(ui.Label('Επιλέξτε τουλάχιστον μία γραμμή για σύγκριση.'));
      return;
    }
    
    // Create the chart
    var chart = ui.Chart(filteredData, 'ScatterChart', {
      title: 'Σύγκριση Γραμμών - ' + parameter,
      hAxis: {
        title: 'Ημερομηνία',
        format: 'MMM-yy',
        titleTextStyle: {italic: false, bold: true},
        slantedText: true,
        slantedTextAngle: 45
      },
      vAxis: {
        title: parameter,
        titleTextStyle: {italic: false, bold: true}
      },
      pointSize: 5,
      lineWidth: 2,
      legend: 'none',
      chartArea: {width: '80%', height: '70%'},
      height: 350
    });
    
    // Update the legend
    legendContainer.clear();
    var legendTitle = ui.Label('Υπόμνημα:', {fontWeight: 'bold', margin: '0 0 5px 0'});
    legendContainer.add(legendTitle);
    
    transectIds.forEach(function(id) {
      var transect = transectStore[id];
      var legendItem = ui.Panel({
        widgets: [
          ui.Label('■', {color: transect.color, margin: '0 5px 0 0'}),
          ui.Label(transect.name, {margin: '0 10px 0 0'})
        ],
        layout: ui.Panel.Layout.flow('horizontal')
      });
      legendContainer.add(legendItem);
    });
    
    // Add the chart to the container
    container.add(chart);
  }
}

// Update the selected transect count
function updateSelectedCount() {
  var count = 0;
  for (var id in transectStore) {
    if (transectStore[id].selected) count++;
  }
  
  var saveButton = transectListPanel.widgets().get(transectListPanel.widgets().length() - 1);
  if (saveButton) {
    saveButton.setLabel('💾 Save Selected (' + count + '/3)');
    saveButton.setDisabled(count === 0 || count > 3);
  }
}

