// Cloud mask function for Landsat 8/9
function maskL8sr(image) {
  var cloudShadowBitMask = (1 << 3);
  var cloudsBitMask = (1 << 5);
  var qa = image.select('QA_PIXEL');
  var mask = qa.bitwiseAnd(cloudShadowBitMask).eq(0)
      .and(qa.bitwiseAnd(cloudsBitMask).eq(0));
  return image.updateMask(mask);
}

function loadData() {
  globalGeometry = drawingTools.layers().get(0).getEeObject();
  var startDate = ee.Date(startDateBox.getValue());
  var endDate = ee.Date(endDateBox.getValue());
  var mode = modeSelect.getValue();
  var parameter = parameterSelect.getValue();

  if (!globalGeometry) {
    print('Σφάλμα: Παρακαλώ σχεδιάστε πρώτα ' + (mode === 'Ανάλυση Περιοχής (ROI)' ? 'μια περιοχή' : 'μια γραμμή') + '.');
    return;
  }

  currentGeometry = globalGeometry;

  if (mode === 'Ανάλυση Υψομέτρου Λίμνης') {
    runLakeHeightAnalysis(globalGeometry, startDateBox.getValue(), endDateBox.getValue());
    return;
  }

  print('Αναζήτηση διαθέσιμων εικόνων...');
  sliderPanel.clear();
  sliderPanel.add(ui.Label('Φόρτωση...'));

  var bounds = mode === 'Ανάλυση Περιοχής (ROI)' ? globalGeometry : globalGeometry.buffer(1000);

  if (parameter.indexOf('Temperature') > -1) {
    print('Loading Landsat 8/9 data for temperature...');
    var l9 = ee.ImageCollection('LANDSAT/LC09/C02/T1_L2')
      .filterBounds(bounds)
      .filterDate(startDate, endDate)
      .map(maskL8sr);
    var l8 = ee.ImageCollection('LANDSAT/LC08/C02/T1_L2')
      .filterBounds(bounds)
      .filterDate(startDate, endDate)
      .map(maskL8sr);
    globalImageCollection = ee.ImageCollection(l8.merge(l9)).sort('system:time_start');

  } else {
    print('Loading Sentinel-2 L1C data...');
    globalImageCollection = ee.ImageCollection("COPERNICUS/S2_HARMONIZED")
      .filterBounds(bounds)
      .filterDate(startDate, endDate)
      .filter(ee.Filter.lt('CLOUDY_PIXEL_PERCENTAGE', 35))
      .sort('system:time_start');
  }

  var timestamps = globalImageCollection.aggregate_array('system:time_start');

  timestamps.evaluate(function(tsList) {
    if (tsList && tsList.length > 0) {
      var dateList = tsList.map(function(timestamp) {
        var d = new Date(timestamp);
        var year = d.getFullYear();
        var month = ('0' + (d.getMonth() + 1)).slice(-2);
        var day = ('0' + d.getDate()).slice(-2);
        return year + '-' + month + '-' + day;
      });
      
      print('Βρέθηκαν ' + dateList.length + ' εικόνες.');
      globalDateList = dateList;
      sliderPanel.clear();

      if (mode === 'Ανάλυση Περιοχής (ROI)') {
        setupRegionAnalysis(dateList);
      } else {
        setupTransectAnalysis(dateList);
      }
    } else {
      print('Δεν βρέθηκαν εικόνες για αυτή την περίοδο.');
      sliderPanel.clear();
      sliderPanel.add(ui.Label('Δεν βρέθηκαν εικόνες.'));
    }
  });
}

function collectROITimeSeries() {
  if (!comparisonMode || !globalImageCollection || !globalGeometry) return;
  
  print('🔄 Συλλογή δεδομένων χρονοσειρών για ROI...');
  
  var parameter = parameterSelect.getValue();
  
  // Process a subset of images for time series
  var limitedCollection = globalImageCollection.limit(15); // Limit to avoid timeout
  
  var timeSeriesFeatures = limitedCollection.map(function(image) {
    var date = ee.Date(image.get('system:time_start'));
    var processedImage = processImage(image, parameter, true);
    var bandName = processedImage.bandNames().get(0);
    
    var stats = processedImage.select(bandName).reduceRegion({
      reducer: ee.Reducer.mean(),
      geometry: globalGeometry,
      scale: 30,
      maxPixels: 1e8,
      tileScale: 2
    });
    
    return ee.Feature(null, {
      date: date.format('YYYY-MM-dd'),
      value: stats.get(bandName)
    });
  });
  
  timeSeriesFeatures.evaluate(function(featureList) {
    if (featureList && featureList.length > 0) {
      var timeSeriesData = featureList.map(function(feature) {
        return {
          date: feature.properties.date,
          value: feature.properties.value
        };
      }).filter(function(point) {
        return point.value !== null && !isNaN(point.value);
      });
      
      currentAnalysisData = {
        type: 'roi',
        parameter: parameter,
        timeSeriesData: timeSeriesData,
        geometry: globalGeometry
      };
      
      print('✅ Συλλέχθηκαν ' + timeSeriesData.length + ' σημεία δεδομένων για ROI');
    } else {
      print('⚠️ Δεν συλλέχθηκαν δεδομένα χρονοσειρών για ROI');
    }
  });
}

