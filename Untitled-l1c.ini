function setupTransectAnalysis(dateList) {
  sliderPanel.add(ui.Label('Επεξεργασία δεδομένων transect...', {fontWeight: 'bold'}));
  chartPanel.style().set('shown', true);
  mapPanel.style().set('width', '70%');
  
  var numPoints = parseInt(numPointsBox.getValue()) || 50;
  var selectedParam = parameterSelect.getValue();
  var line = ee.Geometry(globalGeometry);
  
  line.coordinates().evaluate(function(coords) {
    if (!coords || coords.length < 2) {
      print('Error: Invalid line geometry.');
      return;
    }
    
    var points = [];
    var totalLength = 0;
    var segmentLengths = [];
    for (var i = 0; i < coords.length - 1; i++) {
        var p1 = coords[i];
        var p2 = coords[i+1];
        var dx = p1[0] - p2[0];
        var dy = p1[1] - p2[1];
        var length = Math.sqrt(dx * dx + dy * dy);
        segmentLengths.push(length);
        totalLength += length;
    }

    var cumulativeLength = 0;
    var segmentIndex = 0;
    
    for (var i = 0; i < numPoints; i++) {
        var targetDist = (i / (numPoints - 1)) * totalLength;
        if (i === numPoints - 1) {
          targetDist = totalLength;
        }
        
        while (targetDist > cumulativeLength + segmentLengths[segmentIndex] && segmentIndex < segmentLengths.length - 1) {
            cumulativeLength += segmentLengths[segmentIndex];
            segmentIndex++;
        }
        
        var distIntoSegment = targetDist - cumulativeLength;
        var fractionAlongSegment = 0;
        if (segmentLengths[segmentIndex] > 0) {
            fractionAlongSegment = distIntoSegment / segmentLengths[segmentIndex];
        }

        var startPoint = coords[segmentIndex];
        var endPoint = coords[segmentIndex + 1];
        
        var x = startPoint[0] + (endPoint[0] - startPoint[0]) * fractionAlongSegment;
        var y = startPoint[1] + (endPoint[1] - startPoint[1]) * fractionAlongSegment;
        
        points.push(ee.Feature(ee.Geometry.Point([x, y]), { index: i }));
    }

    var pointsFC = ee.FeatureCollection(points);
    map.layers().set(2, ui.Map.Layer(pointsFC, {color: 'yellow'}, 'Transect Points'));
    
    // Create a new transect in the store
    var transectId = 'transect_' + Date.now();
    transectStore[transectId] = {
      id: transectId,
      coords: coords,
      points: pointsFC,
      numPoints: numPoints,
      color: '#' + Math.floor(Math.random()*16777215).toString(16),
      selected: true,  // Auto-select newly created transect
      processing: false,
      status: 'Ready',
      createdAt: new Date().toISOString()
    };
    
    // Update the transect list UI with the new transect
    updateTransectList(selectedParam);
  });
}

// Save multiple selected transects
function saveSelectedTransects(selectedParam) {
  var selectedCount = 0;
  var processedCount = 0;
  
  // Count selected transects
  for (var id in transectStore) {
    if (transectStore[id].selected) {
      selectedCount++;
    }
  }
  
  if (selectedCount === 0) {
    print('Error: No transects selected. Please select 1-3 transects to save.');
    return;
  }
  
  if (selectedCount > 3) {
    print('Error: Maximum 3 transects can be saved at once.');
    return;
  }
  
  // Process each selected transect
  var processedCount = 0;
  
  // Process each selected transect with a delay
  Object.keys(transectStore).forEach(function(id, index) {
    if (transectStore[id].selected) {
      setTimeout(function() {
        processTransectData(id, selectedParam, function() {
          processedCount++;
          print('Processed transect ' + processedCount + ' of ' + selectedCount);
          
          if (processedCount === selectedCount) {
            print('✅ Successfully processed all ' + processedCount + ' transects.');
            // Update UI to show completion
            updateTransectList(selectedParam);
          }
        });
      }, index * 2000); // 2 second delay between each transect
    }
  });
}

function processTransectData(transectId, selectedParam, callback) {
  try {
    // Get the transect from the store
    var transect = transectStore[transectId];
    if (!transect) {
      throw new Error('Transect not found: ' + transectId);
    }
    
    // Initialize transect properties
    transect.error = null;
    transect.processing = true;
    transect.status = 'Processing...';
    updateTransectList(selectedParam);
    
    print('🔍 Starting processing for transect: ' + transectId);
    
    var pointsFC = transect.points;
    if (!pointsFC) {
      throw new Error('No points found in transect');
    }
    // Update status to show we're starting the analysis
    transect.status = 'Analyzing...';
    updateTransectList(selectedParam);
    
    var values = globalImageCollection.map(function(image) {
      var date = ee.Date(image.get('system:time_start'));
      var unmaskedImage = image.unmask(0);
      
      var processedImage = processImage(unmaskedImage, selectedParam, false);
      var bandName = processedImage.bandNames().get(0);

      var waterMask;
      if (selectedParam.indexOf('Temperature') > -1) {
        waterMask = unmaskedImage.select('QA_PIXEL').bitwiseAnd(1 << 7).gt(0).rename('water');
      } else {
        waterMask = safeNormalizedDifference(unmaskedImage, 'B3', 'B8').gt(0).rename('water');
      }
    
    var combinedImage = processedImage.addBands(waterMask);

    var sampledData = combinedImage.reduceRegions({
        collection: pointsFC,
        reducer: ee.Reducer.first(),
        scale: 30,
        tileScale: 4
    });

    var vals = sampledData.aggregate_array(bandName);
    var isWater = sampledData.aggregate_array('water');
    
    return ee.Feature(null, {
      date: date.format('YYYY-MM-dd'),
      values: vals,
      is_water: isWater
    });
  });
  
  values.evaluate(
    function(result) {
      try {
        if (!result) {
          sliderPanel.clear();
          sliderPanel.add(ui.Label('Σφάλμα: Δεν ήταν δυνατή η ανάλυση των δεδομένων.'));
          transect.status = 'Error';
          transect.error = 'No result data';
          transect.processing = false;
          updateTransectList(selectedParam);
          if (callback) callback();
          return;
        }
        
        var features = result.features || result;
        if (!Array.isArray(features) || features.length === 0) {
          sliderPanel.clear();
          sliderPanel.add(ui.Label('Σφάλμα: Δεν βρέθηκαν δεδομένα.'));
          transect.status = 'Error';
          transect.error = 'No features found';
          transect.processing = false;
          updateTransectList(selectedParam);
          if (callback) callback();
          return;
        }
        
        var data = [], dates = [], isWaterData = [];
        
        for (var i = 0; i < features.length; i++) {
          var feature = features[i];
          if (feature && feature.properties && feature.properties.values) {
            dates.push(feature.properties.date);
            data.push(feature.properties.values);
            isWaterData.push(feature.properties.is_water);
          }
        }
        
        if (data.length === 0) {
          sliderPanel.clear();
          sliderPanel.add(ui.Label('Δεν βρέθηκαν έγκυρα δεδομένα.'));
          transect.status = 'Error';
          transect.error = 'No valid data';
          transect.processing = false;
          updateTransectList(selectedParam);
          if (callback) callback();
          return;
        }
        
        // Store analysis results in the transect object
        transect.analysis = {
          type: 'transect',
          parameter: selectedParam,
          data: data,
          dates: dates,
          isWaterData: isWaterData,
          timestamp: new Date().toISOString()
        };
        
        // Update the current analysis data
        currentAnalysisData = {
          transectId: transectId,
          type: 'transect',
          parameter: selectedParam,
          data: data,
          dates: dates,
          isWaterData: isWaterData,
          geometry: ee.Geometry.LineString(transect.coords)
        };
        
        // Create and display the heatmap
        createTransectHeatmap(data, dates, isWaterData, selectedParam, transect);
        
        // Update the UI
        sliderPanel.clear();
        sliderPanel.add(ui.Label('Ανάλυση transect "' + transect.name + '" ολοκληρώθηκε!', {fontWeight: 'bold'}));
        
        var updateButton = ui.Button({
          label: 'Ενημέρωση ανάλυσης',
          onClick: function() { 
            setupTransectAnalysis(globalDateList, transectId);
          },
          style: {stretch: 'horizontal'}
        });
        
        var compareButton = ui.Button({
          label: 'Σύγκριση με άλλες γραμμές',
          onClick: function() {
            showTransectComparison(transectId, selectedParam);
          },
          style: {stretch: 'horizontal'}
        });
        
        sliderPanel.add(updateButton);
        sliderPanel.add(compareButton);
        saveResultButton.style().set('shown', true);
        
        // Mark as complete
        transect.status = 'Complete';
        transect.processing = false;
        updateTransectList(selectedParam);
        
        // Auto-save if comparison mode is on
        if (comparisonMode) {
          saveCurrentResult();
        }
        
        // Call callback
        if (callback) callback();
        
      } catch (evalError) {
        print('❌ Error in evaluate callback:', evalError);
        transect.status = 'Error';
        transect.error = evalError.toString();
        transect.processing = false;
        updateTransectList(selectedParam);
        if (callback) callback();
      }
    },
    function(error) {
      // Error callback for evaluate
      print('❌ Error evaluating values:', error);
      transect.status = 'Error';
      transect.error = error.toString();
      transect.processing = false;
      updateTransectList(selectedParam);
      if (callback) callback();
    }
  );
  } catch (error) {
    // Handle any errors that occurred during processing
    print('❌ Error in processTransectData:', error);
    
    // Update transect status
    if (transect) {
      transect.status = 'Error';
      transect.error = error.toString();
      transect.processing = false;
      updateTransectList(selectedParam);
    }
    
    // Call the callback if provided
    if (callback) {
      callback();
    }
  }

function createTransectHeatmap(data, dates, isWaterData, parameter, transect) {
  // If transect is provided, use its color for the chart
  var chartColor = transect && transect.color ? transect.color : '#1f77b4';
  if (!data || data.length === 0 || !data[0] || data[0].length === 0) {
    chartPanel.clear();
    chartPanel.add(ui.Label('Σφάλμα: Δεν βρέθηκαν έγκυρα δεδομένα για τη δημιουργία γραφήματος transect.'));
    return;
  }
  
  chartPanel.clear();
  chartPanel.add(ui.Label({
    value: 'Χωροχρονική Ανάλυση: ' + parameter.split(' - ')[0],
    style: {fontWeight: 'bold', fontSize: '16px', margin: '0 0 10px 0'}
  }));
  
  var vizParams = getVizParams(parameter);
  var basePalette, min, max;

  if (vizParams.isClassified) {
    basePalette = vizParams.palette;
    min = 0;
    max = vizParams.scale[vizParams.scale.length - 1];
  } else {
    basePalette = vizParams.basePalette || vizParams.palette;
    min = vizParams.min;
    max = vizParams.max;
  }
  
  var allValues = [];
  data.forEach(function(row, i) {
    var waterFlags = isWaterData[i];
    row.forEach(function(val, j) {
      if (val !== null && !isNaN(val) && waterFlags[j]) {
        allValues.push(val);
      }
    });
  });
  
  var minVal = allValues.length > 0 ? Math.min.apply(null, allValues) : min;
  var maxVal = allValues.length > 0 ? Math.max.apply(null, allValues) : max;
  
  var chartData = [];
  chartData.push(['Ημερομηνία', 'Θέση στη Γραμμή', {'role': 'style'}, {'role': 'tooltip'}]);
  
  var parameterName = parameter.split(' - ')[0];
  var fullPalette = generateSmoothPalette(basePalette, 100);

  for (var dateIdx = 0; dateIdx < dates.length; dateIdx++) {
    for (var pointIdx = 0; pointIdx < data[dateIdx].length; pointIdx++) {
      var value = data[dateIdx][pointIdx];
      var isWater = isWaterData[dateIdx][pointIdx];
      
      var color, styleString, tooltipString;

      if (isWater) {
        if (value !== null && !isNaN(value)) {
          var normalizedValue = Math.max(0, Math.min(1, (value - min) / (max - min)));
          var colorIndex = Math.floor(normalizedValue * (fullPalette.length - 1));
          color = fullPalette[colorIndex];
          tooltipString = 'Ημ/νία: ' + dates[dateIdx] + '\n' + 'Σημείο: ' + pointIdx + ' (Water)\n' + parameterName + ': ' + value.toFixed(3);
        } else {
          color = '#d1d5db';
          tooltipString = 'Ημ/νία: ' + dates[dateIdx] + '\n' + 'Σημείο: ' + pointIdx + ' (Water)\n' + parameterName + ': No Data';
        }
      } else {
        color = '#6b7280';
        tooltipString = 'Ημ/νία: ' + dates[dateIdx] + '\n' + 'Σημείο: ' + pointIdx + ' (Land)';
      }

      if (color) {
        styleString = 'point { size: 7; fill-color: ' + color + '; }';
        chartData.push([new Date(dates[dateIdx]), pointIdx, styleString, tooltipString]);
      }
    }
  }
  
  // Format dates for display in tooltips
  var formattedDates = dates.map(function(dateStr) {
    var date = new Date(dateStr);
    var monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var month = monthNames[date.getMonth()];
    var year = date.getFullYear().toString().substr(-2);
    return month + '-' + year;
  });
  
  // Update chart data with formatted dates
  for (var i = 1; i < chartData.length; i++) {
    var date = new Date(chartData[i][0]);
    var formattedDate = formattedDates[dates.indexOf(chartData[i][0].toISOString().split('T')[0])];
    chartData[i][3] = chartData[i][3].replace(/Ημ.νία:.*?\n/, 'Ημ/νία: ' + formattedDate + '\n');
  }
  
  var scatterChart = ui.Chart(chartData, 'ScatterChart').setOptions({
      title: (transect ? transect.name + ' - ' : '') + 'Τιμές κατά μήκος της γραμμής ανά ημερομηνία',
      hAxis: { 
        title: 'Ημερομηνία', 
        gridlines: { color: 'transparent' }, 
        format: 'MMM-yy',
        titleTextStyle: { italic: false, bold: true },
        slantedText: true,
        slantedTextAngle: 45
      },
      vAxis: { 
        title: 'Θέση στη γραμμή (σημείο #)', 
        minValue: 0, 
        maxValue: data[0].length - 1,
        titleTextStyle: { italic: false, bold: true }
      },
      legend: 'none', 
      backgroundColor: '#f5f5f5', 
      chartArea: {width: '75%', height: '70%'}, 
      height: 400, 
      pointSize: 7,
      colors: [chartColor]
  });
  chartPanel.add(scatterChart);
  
  var averageValuesData = [];
  var yAxisLabel = 'Μέση Τιμή (' + parameterName + ')';
  averageValuesData.push(['Date', yAxisLabel]);

  for (var i = 0; i < dates.length; i++) {
    var dailyValues = data[i], dailyWaterFlags = isWaterData[i], waterValues = [];
    for (var j = 0; j < dailyValues.length; j++) {
      if (dailyWaterFlags[j] && dailyValues[j] !== null && !isNaN(dailyValues[j])) {
        waterValues.push(dailyValues[j]);
      }
    }
    if (waterValues.length > 0) {
      var sum = waterValues.reduce(function(a, b) { return a + b; }, 0);
      var average = sum / waterValues.length;
      averageValuesData.push([new Date(dates[i]), average]);
    }
  }
  
  if (averageValuesData.length > 1) {
    var timeSeriesChart = ui.Chart(averageValuesData, 'LineChart').setOptions({
      title: (transect ? transect.name + ' - ' : '') + 'Μέση Τιμή κατά μήκος της Γραμμής στο Χρόνο',
      vAxis: {
        title: yAxisLabel,
        titleTextStyle: { italic: false, bold: true }
      },
      hAxis: {
        title: 'Ημερομηνία',
        format: 'MMM-yy',
        titleTextStyle: { italic: false, bold: true },
        slantedText: true,
        slantedTextAngle: 45
      },
      height: 300,
      legend: 'none',
      colors: [chartColor],
      series: { 0: { lineWidth: 2, pointSize: 4 } },
      chartArea: {width: '80%'}
    });
    chartPanel.add(timeSeriesChart);
    
    if (currentAnalysisData) {
      currentAnalysisData.averageTimeSeries = averageValuesData.slice(1);
    }
  }

  var colorLegendPanel = ui.Panel({ layout: ui.Panel.Layout.flow('horizontal'), style: {margin: '10px 0', padding: '0px 8px'} });
  var colorBar = ui.Panel(
    generateSmoothPalette(basePalette, 30).map(function(c) {
      return ui.Label('', {backgroundColor: c, padding: '8px 3px', margin: '0'});
    }), ui.Panel.Layout.flow('horizontal')
  );
  
  colorLegendPanel.add(ui.Label(min.toFixed(2), {margin: '0 4px 0 0'}));
  colorLegendPanel.add(colorBar);
  colorLegendPanel.add(ui.Label(max.toFixed(2), {margin: '0 0 0 4px'}));
  chartPanel.add(ui.Label('Κλίμακα χρωμάτων (Νερό):', {fontWeight: 'bold'}));
  chartPanel.add(colorLegendPanel);
  
  var dateSelector = ui.Slider({ min: 0, max: dates.length - 1, value: 0, step: 1, style: {stretch: 'horizontal'}, onChange: function(index) { updateLineProfile(Math.round(index), dates, data, parameter); }});
  chartPanel.add(ui.Label('Επιλέξτε ημερομηνία για προφίλ γραμμής:', {fontWeight: 'bold', margin: '20px 0 5px 0'}));
  chartPanel.add(dateSelector);
  
  var lineProfilePanel = ui.Panel({style: {margin: '10px 0'}});
  chartPanel.add(lineProfilePanel);
  
  function updateLineProfile(dateIndex, dates, data, parameter) {
    lineProfilePanel.clear();
    var selectedDate = dates[dateIndex];
    var values = data[dateIndex];
    var lineData = [['Σημείο', parameter.split(' - ')[0]]];
    for (var i = 0; i < values.length; i++) {
      lineData.push([i, values[i]]);
    }
    
    var lineChart = ui.Chart(lineData, 'LineChart').setOptions({
        title: 'Προφίλ γραμμής για ' + selectedDate,
        hAxis: {title: 'Θέση στη γραμμή (σημείο #)'},
        vAxis: {title: parameter.split(' - ')[0], viewWindow: { min: min, max: max }},
        colors: ['#1976D2'], pointSize: 5, lineWidth: 2, height: 300
    });
    lineProfilePanel.add(lineChart);
  }
  
  updateLineProfile(0, dates, data, parameter);
  
  var statsPanel = ui.Panel({
    widgets: [
      ui.Label('Στατιστικά (μόνο για το νερό):', {fontWeight: 'bold'}),
      ui.Label('Ελάχιστο: ' + minVal.toFixed(3)),
      ui.Label('Μέγιστο: ' + maxVal.toFixed(3)),
      ui.Label('Εύρος: ' + (maxVal - minVal).toFixed(3)),
      ui.Label('Μέσος όρος: ' + (allValues.length > 0 ? (allValues.reduce(function(a,b){return a+b;}, 0) / allValues.length).toFixed(3) : 'N/A'))
    ],
    style: {margin: '10px 0'}
  });
  chartPanel.add(statsPanel);
  
  var exportButton = ui.Button({ label: 'Εξαγωγή δεδομένων CSV', onClick: function() { exportTransectData(data, dates, parameter); } });
  chartPanel.add(exportButton);
}

function exportTransectData(data, dates, parameter) {
  var header = 'Date';
  for (var i = 0; i < data[0].length; i++) {
    header += ',Point_' + (i + 1);
  }
  var csvContent = header + '\n';
  
  for (var i = 0; i < dates.length; i++) {
    csvContent += dates[i] + ',' + data[i].join(',') + '\n';
  }
  
  print('=== TRANSECT DATA EXPORT ===');
  print('Parameter: ' + parameter);
  print('Number of dates: ' + dates.length);
  print('Number of points: ' + (data[0] ? data[0].length : 0));
  print('Copy the data below to save as CSV:');
  print(csvContent);
  
  var features = [];
  for (var dateIndex = 0; dateIndex < dates.length; dateIndex++) {
    var properties = {date: dates[dateIndex]};
    for (var pointIndex = 0; pointIndex < data[dateIndex].length; pointIndex++) {
      properties['Point_' + (pointIndex + 1)] = data[dateIndex][pointIndex];
    }
    features.push(ee.Feature(null, properties));
  }
  
  var fc = ee.FeatureCollection(features);
  
  Export.table.toDrive({ collection: fc, description: 'transect_' + parameter.split(' - ')[0] + '_export', fileFormat: 'CSV' });
  print('Export task created! Check the Tasks tab to start the export.');
}

// --- 5. ΣΥΝΑΡΤΗΣΕΙΣ ΕΠΕΞΕΡΓΑΣΙΑΣ ---
function safeNormalizedDifference(image, band1, band2) {
  var b1 = image.select(band1);
  var b2 = image.select(band2);
  var numerator = b1.subtract(b2);
  var denominator = b1.add(b2).add(0.0001);
  return numerator.divide(denominator);
}

function processImage(image, parameter, applyMask) {
  var waterMask;
  var shouldApplyMask = (applyMask === false) ? false : true;

  if (parameter.indexOf('Temperature') > -1) {
    waterMask = image.select('QA_PIXEL').bitwiseAnd(1 << 7).gt(0);
  } else {
    var toa = image.divide(10000);
    waterMask = safeNormalizedDifference(toa, 'B3', 'B8').gt(0);
  }
  
  var procImage = image.divide(10000);

  switch(parameter) {
    case 'Water Surface Temperature - Θερμοκρασία Επιφάνειας (°C)':
      return calculateWST(image, waterMask, shouldApplyMask);
    case 'True Color - Πραγματικό Χρώμα':
      return image.updateMask(waterMask);
    case 'NDWI - Δείκτης Νερού':
      var ndwiImage = safeNormalizedDifference(procImage, 'B3', 'B8').rename('NDWI');
      return shouldApplyMask ? ndwiImage.updateMask(waterMask) : ndwiImage;
    case 'GNIR - Λόγος Πράσινου/NIR':
      return calculateGNIR(procImage, waterMask, shouldApplyMask);
    case 'NDCI - Χλωροφύλλη':
      return calculateNDCI(procImage, waterMask, shouldApplyMask);
    case 'NDTI - Θολότητα':
      return calculateNDTI(procImage, waterMask, shouldApplyMask);
    case 'Chl-a (Se2WaQ) - Χλωροφύλλη-α':
      return calculateChla_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'Cya (Se2WaQ) - Κυανοβακτήρια':
      return calculateCya_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'Turb (Se2WaQ) - Θολότητα (NTU)':
      return calculateTurb_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'CDOM (Se2WaQ) - Οργανική Ύλη':
      return calculateCDOM_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'DOC (Se2WaQ) - Διαλυμένος Άνθρακας':
      return calculateDOC_Se2WaQ(procImage, waterMask, shouldApplyMask);
    case 'Color (Se2WaQ) - Χρώμα Νερού':
      return calculateColor_Se2WaQ(procImage, waterMask, shouldApplyMask);
    default:
      return calculateNDCI(procImage, waterMask, shouldApplyMask);
  }
}

function getVizParams(parameter) {
  var defaultPalette = ['#0000FF', '#00FFFF', '#00FF00', '#FFFF00', '#FF0000'];
  var ndwiPalette = ['#8B4513', '#FFFF00', '#00FFFF', '#0000FF'];
  var tsmPalette = ['#0000FF', '#00FFFF', '#FFFF00', '#FF8000', '#FF0000'];
  var tempPalette = ['#000080', '#0000FF', '#00FFFF', '#FFFF00', '#FF0000', '#800000'];
  var se2waq_base_palette = ['#496FF2', '#82D35F', '#FEFD05', '#FD0004', '#8E2026', '#D97CF5'];
  var p;
  
  switch(parameter) {
    case 'Water Surface Temperature - Θερμοκρασία Επιφάνειας (°C)': p = {min: 5, max: 35, basePalette: tempPalette}; break;
    case 'True Color - Πραγματικό Χρώμα': return {bands: ['B4', 'B3', 'B2'], min: 0, max: 3000};
    case 'NDCI - Χλωροφύλλη': p = {min: -0.2, max: 0.6, basePalette: defaultPalette}; break;
    case 'NDTI - Θολότητα': p = {min: -0.2, max: 0.3, basePalette: tsmPalette}; break;
    case 'NDWI - Δείκτης Νερού': p = {min: -0.5, max: 0.8, basePalette: ndwiPalette}; break;
    case 'GNIR - Λόγος Πράσινου/NIR': p = {min: 1, max: 10, basePalette: defaultPalette}; break;
    case 'Chl-a (Se2WaQ) - Χλωροφύλλη-α': p = {min: scaleChl_a[0], max: scaleChl_a[5], basePalette: se2waq_base_palette}; break;
    case 'Cya (Se2WaQ) - Κυανοβακτήρια': p = {min: scaleCya[0], max: scaleCya[5], basePalette: se2waq_base_palette}; break;
    case 'Turb (Se2WaQ) - Θολότητα (NTU)': p = {min: scaleTurb[0], max: scaleTurb[5], basePalette: se2waq_base_palette}; break;
    case 'CDOM (Se2WaQ) - Οργανική Ύλη': p = {min: scaleCDOM[0], max: scaleCDOM[5], basePalette: se2waq_base_palette}; break;
    case 'DOC (Se2WaQ) - Διαλυμένος Άνθρακας': p = {min: scaleDOC[0], max: scaleDOC[5], basePalette: se2waq_base_palette}; break;
    case 'Color (Se2WaQ) - Χρώμα Νερού': p = {min: scaleColor[0], max: scaleColor[5], basePalette: se2waq_base_palette}; break;
    default: p = {min: 0, max: 1, basePalette: ['blue', 'green', 'red']}; break;
  }
  
  p.palette = generateSmoothPalette(p.basePalette, 100);
  p.isClassified = false;
  return p;
}

// --- 6. ΣΥΝΑΡΤΗΣΕΙΣ ΥΠΟΛΟΓΙΣΜΟΥ ΔΕΙΚΤΩΝ ---

function applyMaskConditional(image, mask, apply) {
    return apply ? image.updateMask(mask) : image;
}

function calculateWST(image, waterMask, applyMask) {
  var thermalBand = image.select('ST_B10');
  var tempC = thermalBand.multiply(0.00341802).add(149.0).subtract(273.15).rename('WST');
  return applyMaskConditional(tempC, waterMask, applyMask);
}

function calculateNDCI(image, waterMask, applyMask) {
  var result = safeNormalizedDifference(image, 'B5', 'B4').rename('NDCI');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateNDTI(image, waterMask, applyMask) {
  var result = safeNormalizedDifference(image, 'B4', 'B3').rename('NDTI');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateGNIR(image, waterMask, applyMask) {
  var b8_safe = image.select('B8').add(0.0001);
  var result = image.select('B3').divide(b8_safe).rename('GNIR');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateChla_Se2WaQ(image, waterMask, applyMask) {
  var b1_safe = image.select('B1').add(0.0001);
  var ratio = image.select('B3').divide(b1_safe);
  var result = ee.Image(4.26).multiply(ratio.pow(3.94)).rename('Chla_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateCya_Se2WaQ(image, waterMask, applyMask) {
  var b2_safe = image.select('B2').add(0.0001);
  var ratio = image.select('B3').multiply(image.select('B4')).divide(b2_safe);
  var result = ee.Image(115530.31).multiply(ratio.pow(2.38)).rename('Cya_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateTurb_Se2WaQ(image, waterMask, applyMask) {
  var b1_safe = image.select('B1').add(0.0001);
  var ratio = image.select('B3').divide(b1_safe);
  var result = ee.Image(8.93).multiply(ratio).subtract(6.39).rename('Turb_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateCDOM_Se2WaQ(image, waterMask, applyMask) {
  var b4_safe = image.select('B4').add(0.0001);
  var ratio = image.select('B3').divide(b4_safe);
  var result = ee.Image(537).multiply(ee.Image(-2.93).multiply(ratio).exp()).rename('CDOM_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateDOC_Se2WaQ(image, waterMask, applyMask) {
  var b4_safe = image.select('B4').add(0.0001);
  var ratio = image.select('B3').divide(b4_safe);
  var result = ee.Image(432).multiply(ee.Image(-2.24).multiply(ratio).exp()).rename('DOC_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

function calculateColor_Se2WaQ(image, waterMask, applyMask) {
  var b4_safe = image.select('B4').add(0.0001);
  var ratio = image.select('B3').divide(b4_safe);
  var result = ee.Image(25366).multiply(ee.Image(-4.53).multiply(ratio).exp()).rename('Color_Se2WaQ');
  return applyMaskConditional(result, waterMask, applyMask);
}

// --- 7. ΣΥΝΑΡΤΗΣΗ ΔΗΜΙΟΥΡΓΙΑΣ ΥΠΟΜΝΗΜΑΤΟΣ ---

