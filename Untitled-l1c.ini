function addDemoData() {
  print('🎯 Προσθήκη demo δεδομένων για δοκιμή της λειτουργίας σύγκρισης...');
  
  // Create sample time series data
  var dates = ['2023-01-15', '2023-02-15', '2023-03-15', '2023-04-15', '2023-05-15', 
               '2023-06-15', '2023-07-15', '2023-08-15', '2023-09-15', '2023-10-15'];
  
  // Demo dataset 1: Chl-a seasonal pattern
  var chlaDemoData = dates.map(function(date, i) {
    var baseValue = 15 + 10 * Math.sin((i / dates.length) * 2 * Math.PI); // Seasonal variation
    var noise = (Math.random() - 0.5) * 3; // Add some noise
    return {
      date: date,
      value: Math.max(0, baseValue + noise)
    };
  });
  
  // Demo dataset 2: Temperature with different seasonal pattern
  var tempDemoData = dates.map(function(date, i) {
    var baseValue = 18 + 8 * Math.sin((i / dates.length) * 2 * Math.PI + Math.PI/4); // Different phase
    var noise = (Math.random() - 0.5) * 2;
    return {
      date: date,
      value: Math.max(5, baseValue + noise)
    };
  });
  
  // Demo dataset 3: Turbidity inverse correlation with temperature
  var turbDemoData = dates.map(function(date, i) {
    var tempValue = tempDemoData[i].value;
    var baseValue = 25 - (tempValue - 15) * 0.8; // Inverse correlation with temp
    var noise = (Math.random() - 0.5) * 3;
    return {
      date: date,
      value: Math.max(0, baseValue + noise)
    };
  });
  
  // Demo dataset 4: Lake height with drought pattern
  var lakeDemoData = dates.map(function(date, i) {
    var baseValue = 1250 - i * 2 + 5 * Math.sin((i / dates.length) * 2 * Math.PI); // Declining trend with seasonal variation
    var noise = (Math.random() - 0.5) * 1.5;
    return {
      date: date,
      value: baseValue + noise
    };
  });
  
  // Add demo results to savedResults
  var demoResults = [
    {
      name: 'Demo Transect - Chl-a',
      parameter: 'Chl-a (Se2WaQ)',
      type: 'transect',
      averageTimeSeries: chlaDemoData.map(function(point) {
        return [new Date(point.date), point.value];
      })
    },
    {
      name: 'Demo Transect - Temperature',
      parameter: 'Water Surface Temperature',
      type: 'transect', 
      averageTimeSeries: tempDemoData.map(function(point) {
        return [new Date(point.date), point.value];
      })
    },
    {
      name: 'Demo Transect - Turbidity',
      parameter: 'Turb (Se2WaQ)',
      type: 'transect',
      averageTimeSeries: turbDemoData.map(function(point) {
        return [new Date(point.date), point.value];
      })
    },
    {
      name: 'Demo Lake - Water Level',
      parameter: 'Lake Height Analysis',
      type: 'lakeHeight',
      timeSeriesData: lakeDemoData.map(function(point) {
        return {
          date: point.date,
          waterLevel: point.value,
          elevation: point.value
        };
      })
    }
  ];
  
  demoResults.forEach(function(demo, i) {
    resultCounter++;
    var resultId = 'demo_' + resultCounter;
    
    savedResults[resultId] = {
      id: resultId,
      name: demo.name + ' (Demo)',
      data: {
        type: demo.type,
        parameter: demo.parameter,
        averageTimeSeries: demo.averageTimeSeries,
        timeSeriesData: demo.timeSeriesData
      },
      timestamp: new Date().toISOString().substring(0, 16).replace('T', ' '),
      analysisType: demo.type === 'transect' ? 'Transect' : 
                   demo.type === 'lakeHeight' ? 'Lake Height' : 'ROI',
      parameter: demo.parameter.split(' - ')[0] || demo.parameter
    };
  });
  
  print('✅ Προστέθηκαν ' + demoResults.length + ' demo αποτελέσματα!');
  print('📊 Σύνολο αποθηκευμένων αποτελεσμάτων: ' + Object.keys(savedResults).length);
  showComparisonButton.setLabel('📈 Σύγκριση (' + Object.keys(savedResults).length + ' αποτελέσματα)');
  print('🎯 Τώρα μπορείτε να ανοίξετε τον πίνακα σύγκρισης για δοκιμή!');
}

// Function to set up a transect with predefined coordinates
function setupTransectWithCoords(coords) {
  // Clear any existing drawings
  drawingTools.layers().get(0).geometries().remove(ee.Geometry.LineString(coords));
  
  // Create a new line geometry from the coordinates
  var line = ee.Geometry.LineString(coords);
  
  // Add the line to the map
  drawingTools.layers().get(0).geometries().add(line);
  
  // Zoom to the transect
  map.centerObject(line, 12);
  
  // Update the instruction
  instructionLabel.setValue('2. Ρυθμίστε το χρονικό εύρος και πατήστε "Φόρτωση Δεδομένων".');
  
  // Return the geometry for further processing
  return line;
}

function saveCurrentResult() {
  if (!currentAnalysisData) {
    print('❌ Δεν υπάρχουν δεδομένα για αποθήκευση!');
    return;
  }
  
  resultCounter++;
  var resultId = 'result_' + resultCounter;
  
  // Create a user-friendly name with more details
  var timestamp = new Date().toISOString().substring(0, 16).replace('T', ' ');
  var parameterShort = currentAnalysisData.parameter.split(' - ')[0];
  var analysisType = currentAnalysisData.type === 'transect' ? 'Transect' : 
                     currentAnalysisData.type === 'lakeHeight' ? 'Lake Height' : 'ROI';
  
  var friendlyName = analysisType + ' - ' + parameterShort + ' (' + timestamp + ')';
  
  savedResults[resultId] = {
    id: resultId,
    name: friendlyName,
    data: JSON.parse(JSON.stringify(currentAnalysisData)), // Deep copy
    timestamp: timestamp,
    analysisType: analysisType,
    parameter: parameterShort
  };
  
  print('✅ Αποτέλεσμα αποθηκεύτηκε: ' + friendlyName);
  print('📊 Σύνολο αποθηκευμένων αποτελεσμάτων: ' + Object.keys(savedResults).length);
  
  // Update comparison button to show count
  showComparisonButton.setLabel('📈 Σύγκριση (' + Object.keys(savedResults).length + ' αποτελέσματα)');
  
  // Auto-clean if too many results
  if (Object.keys(savedResults).length > maxSavedResults) {
    var oldestKey = Object.keys(savedResults).sort()[0];
    delete savedResults[oldestKey];
    print('🗑️ Αφαιρέθηκε το παλαιότερο αποτέλεσμα για εξοικονόμηση μνήμης.');
  }
  
  return resultId;
}

