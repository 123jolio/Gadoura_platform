      fontSize: '11px',
      margin: '2px 0'
    }));
  });
  
  comparisonWindow.add(resultsList);
  
  // Comparison options
  comparisonWindow.add(ui.Label('Επιλέξτε τύπο σύγκρισης:', {fontWeight: 'bold'}));
  
  var comparisonTypeSelect = ui.Select({
    items: [
      'Multi-Parameter Time Series (3+ παράμετροι)',
      'Dual-Axis Comparison (2 παράμετροι)', 
      'Side-by-Side Grid (2-6 παράμετροι)',
      'Correlation Matrix (3+ παράμετροι)',
      'Statistical Summary (όλες οι παράμετροι)'
    ],
    value: 'Multi-Parameter Time Series (3+ παράμετροι)',
    style: {stretch: 'horizontal', margin: '0 0 15px 0'}
  });
  comparisonWindow.add(comparisonTypeSelect);
  
  // Multi-parameter selection area
  comparisonWindow.add(ui.Label('Επιλέξτε παραμέτρους για σύγκριση:', {
    fontWeight: 'bold',
    margin: '0 0 10px 0'
  }));
  
  var parameterSelectionPanel = ui.Panel({
    style: {
      backgroundColor: '#ffffff',
      border: '2px solid #e0e0e0',
      padding: '10px',
      margin: '0 0 15px 0',
      maxHeight: '200px'
    }
  });
  
  var selectedParameters = [];
  
  // Create checkboxes for each saved result
  var checkboxes = [];
  Object.values(savedResults).forEach(function(result) {
    var checkbox = ui.Checkbox({
      label: result.name,
      value: false,
      onChange: function(checked) {
        if (checked) {
          selectedParameters.push(result.id);
        } else {
          var index = selectedParameters.indexOf(result.id);
          if (index > -1) {
            selectedParameters.splice(index, 1);
          }
        }
        updateSelectionInfo();
      },
      style: {margin: '3px 0'}
    });
    checkboxes.push(checkbox);
    parameterSelectionPanel.add(checkbox);
  });
  
  comparisonWindow.add(parameterSelectionPanel);
  
  // Selection info
  var selectionInfoLabel = ui.Label('Επιλεγμένες: 0 παράμετροι', {
    fontSize: '12px',
    color: '#666',
    margin: '0 0 10px 0'
  });
  comparisonWindow.add(selectionInfoLabel);
  
  function updateSelectionInfo() {
    var count = selectedParameters.length;
    selectionInfoLabel.setValue('Επιλεγμένες: ' + count + ' παράμετροι');
    
    if (count === 0) {
      selectionInfoLabel.style().set('color', '#dc3545');
    } else if (count === 1) {
      selectionInfoLabel.style().set('color', '#ffc107');
    } else {
      selectionInfoLabel.style().set('color', '#28a745');
    }
  }
  
  // Quick selection buttons
  var quickSelectPanel = ui.Panel({
    layout: ui.Panel.Layout.flow('horizontal'),
    style: {margin: '0 0 15px 0'}
  });
  
  var selectAllButton = ui.Button({
    label: '✅ Επιλογή Όλων',
    onClick: function() {
      checkboxes.forEach(function(cb) { cb.setValue(true); });
    },
    style: {backgroundColor: '#28a745', color: 'white'}
  });
  
  var clearAllButton = ui.Button({
    label: '❌ Καθαρισμός',
    onClick: function() {
      checkboxes.forEach(function(cb) { cb.setValue(false); });
    },
    style: {backgroundColor: '#dc3545', color: 'white'}
  });
  
  var selectTransectButton = ui.Button({
    label: '📏 Μόνο Transect',
    onClick: function() {
      checkboxes.forEach(function(cb, i) {
        var result = Object.values(savedResults)[i];
        cb.setValue(result.analysisType === 'Transect');
      });
    },
    style: {backgroundColor: '#17a2b8', color: 'white'}
  });
  
  quickSelectPanel.add(selectAllButton);
  quickSelectPanel.add(clearAllButton);
  quickSelectPanel.add(selectTransectButton);
  comparisonWindow.add(quickSelectPanel);
  
  // Generate comparison button
  var generateComparisonButton = ui.Button({
    label: '📈 Δημιουργία Σύγκρισης',
    onClick: function() {
      var comparisonType = comparisonTypeSelect.getValue();
      
      if (selectedParameters.length === 0) {
        print('❌ Παρακαλώ επιλέξτε τουλάχιστον μία παράμετρο!');
        return;
      }
      
      // Check minimum requirements for each comparison type
      var minRequired = getMinParametersRequired(comparisonType);
      if (selectedParameters.length < minRequired) {
        print('❌ Ο τύπος σύγκρισης "' + comparisonType + '" απαιτεί τουλάχιστον ' + 
              minRequired + ' παραμέτρους!');
        return;
      }
      
      generateMultiParameterComparison(selectedParameters, comparisonType, comparisonWindow);
    },
    style: {
      stretch: 'horizontal',
      backgroundColor: '#28a745',
      color: 'white'
    }
  });
  comparisonWindow.add(generateComparisonButton);
  
  // Close button
  var closeButton = ui.Button({
    label: '❌ Κλείσιμο',
    onClick: function() {
      map.remove(comparisonWindow);
    },
    style: {
      stretch: 'horizontal',
      backgroundColor: '#6c757d',
      color: 'white',
      margin: '10px 0 0 0'
    }
  });
  comparisonWindow.add(closeButton);
}

function getMinParametersRequired(comparisonType) {
  switch(comparisonType) {
    case 'Multi-Parameter Time Series (3+ παράμετροι)': return 3;
    case 'Dual-Axis Comparison (2 παράμετροι)': return 2;
    case 'Side-by-Side Grid (2-6 παράμετροι)': return 2;
    case 'Correlation Matrix (3+ παράμετροι)': return 3;
    case 'Statistical Summary (όλες οι παράμετροι)': return 1;
    default: return 1;
  }
}

function generateMultiParameterComparison(selectedParameterIds, comparisonType, parentWindow) {
  var selectedResults = selectedParameterIds.map(function(id) {
    return savedResults[id];
  });
  
  print('🔄 Δημιουργία σύγκρισης: ' + comparisonType);
  print('📊 Επιλεγμένες παράμετροι: ' + selectedResults.length);
  selectedResults.forEach(function(result, i) {
    print('   ' + (i+1) + '. ' + result.name);
  });
  
  // Create comparison results panel
  var comparisonResultsPanel = ui.Panel({
    style: {
      margin: '15px 0 0 0',
      padding: '10px',
      backgroundColor: '#ffffff',
      border: '1px solid #ddd',
      maxHeight: '400px'
    }
  });
  
  parentWindow.add(ui.Label('Αποτελέσματα Σύγκρισης:', {
    fontWeight: 'bold',
    margin: '15px 0 5px 0'
  }));
  parentWindow.add(comparisonResultsPanel);
  
  switch(comparisonType) {
    case 'Multi-Parameter Time Series (3+ παράμετροι)':
      createMultiParameterTimeSeries(selectedResults, comparisonResultsPanel);
      break;
    case 'Dual-Axis Comparison (2 παράμετροι)':
      if (selectedResults.length >= 2) {
        createDualAxisComparison(selectedResults[0], selectedResults[1], comparisonResultsPanel);
      }
      break;
    case 'Side-by-Side Grid (2-6 παράμετροι)':
      createSideBySideGrid(selectedResults, comparisonResultsPanel);
      break;
    case 'Correlation Matrix (3+ παράμετροι)':
      createCorrelationMatrix(selectedResults, comparisonResultsPanel);
      break;
    case 'Statistical Summary (όλες οι παράμετροι)':
      createStatisticalSummary(selectedResults, comparisonResultsPanel);
      break;
  }
}

function createMultiParameterTimeSeries(results, targetPanel) {
  targetPanel.clear();
  
  targetPanel.add(ui.Label('📈 Multi-Parameter Time Series Analysis', {
    fontWeight: 'bold',
    fontSize: '16px',
    margin: '0 0 10px 0'
  }));
  
  // Extract and merge all time series data
  var allTimeSeriesData = {};
  var parameterNames = [];
  
  results.forEach(function(result) {
    var timeSeries = extractTimeSeriesData(result);
    if (timeSeries) {
      var paramName = result.data.parameter.split(' - ')[0];
      parameterNames.push(paramName);
      
      timeSeries.forEach(function(point) {
        if (!allTimeSeriesData[point.date]) {
          allTimeSeriesData[point.date] = {date: point.date};
        }
        allTimeSeriesData[point.date][paramName] = point.value;
      });
    }
  });
  
  if (parameterNames.length === 0) {
    targetPanel.add(ui.Label('❌ Δεν βρέθηκαν έγκυρα δεδομένα χρονοσειρών!', {color: 'red'}));
    return;
  }
  
  // Create normalized comparison chart
  var normalizedData = Object.values(allTimeSeriesData);
  var normalizedChartData = [['Date'].concat(parameterNames.map(function(name) { return name + ' (normalized)'; }))];
  
  // Normalize each parameter separately
  var parameterStats = {};
  parameterNames.forEach(function(param) {
    var values = normalizedData.map(function(point) { return point[param]; }).filter(function(v) { return v !== null && v !== undefined; });
    if (values.length > 0) {
      parameterStats[param] = {
        min: Math.min.apply(null, values),
        max: Math.max.apply(null, values)
      };
    }
  });
  
  normalizedData.forEach(function(point) {
    var row = [new Date(point.date)];
    parameterNames.forEach(function(param) {
      if (point[param] !== null && point[param] !== undefined && parameterStats[param]) {
        var normalizedValue = (point[param] - parameterStats[param].min) / 
                              (parameterStats[param].max - parameterStats[param].min);
        row.push(normalizedValue);
      } else {
        row.push(null);
      }
    });
    normalizedChartData.push(row);
  });
  
  var colors = ['#1976D2', '#D32F2F', '#388E3C', '#F57C00', '#7B1FA2', '#00796B'];
  var seriesOptions = {};
  for (var i = 0; i < parameterNames.length; i++) {
    seriesOptions[i] = {
      color: colors[i % colors.length],
      lineWidth: 2,
      pointSize: 3
    };
  }
  
  var normalizedChart = ui.Chart(normalizedChartData, 'LineChart').setOptions({
    title: 'Normalized Multi-Parameter Comparison (0-1 scale)',
    hAxis: {title: 'Date', format: 'MMM dd'},
    vAxis: {title: 'Normalized Value (0-1)', minValue: 0, maxValue: 1},
    series: seriesOptions,
    height: 350,
    backgroundColor: '#f5f5f5',
    legend: {position: 'top', maxLines: 3}
  });
  
  targetPanel.add(normalizedChart);
  
  // Raw values chart (separate Y-axis for each parameter if they have different units)
  var rawChartData = [['Date'].concat(parameterNames)];
  normalizedData.forEach(function(point) {
    var row = [new Date(point.date)];
    parameterNames.forEach(function(param) {
      row.push(point[param] || null);
    });
    rawChartData.push(row);
  });
  
  var rawChart = ui.Chart(rawChartData, 'LineChart').setOptions({
    title: 'Raw Values Multi-Parameter Comparison',
    hAxis: {title: 'Date', format: 'MMM dd'},
    vAxis: {title: 'Parameter Values (original units)'},
    series: seriesOptions,
    height: 350,
    backgroundColor: '#f5f5f5',
    legend: {position: 'top', maxLines: 3}
  });
  
  targetPanel.add(rawChart);
  
  // Add parameter statistics
  var statsPanel = ui.Panel({
    style: {margin: '10px 0', padding: '10px', backgroundColor: '#f8f9fa'}
  });
  statsPanel.add(ui.Label('📊 Parameter Statistics:', {fontWeight: 'bold'}));
  
  parameterNames.forEach(function(param, i) {
    var color = colors[i % colors.length];
    if (parameterStats[param]) {
      statsPanel.add(ui.Label('● ' + param + ': ' + 
        'Min=' + parameterStats[param].min.toFixed(3) + ', ' +
        'Max=' + parameterStats[param].max.toFixed(3), {
        color: color,
        fontSize: '12px'
      }));
    }
  });
  
  targetPanel.add(statsPanel);
}

function createSideBySideGrid(results, targetPanel) {
  targetPanel.clear();
  
  targetPanel.add(ui.Label('📊 Side-by-Side Grid Comparison', {
    fontWeight: 'bold',
    fontSize: '16px',
    margin: '0 0 10px 0'
  }));
  
  var numResults = results.length;
  var numCols = Math.min(3, numResults); // Maximum 3 columns
  var numRows = Math.ceil(numResults / numCols);
  
  for (var row = 0; row < numRows; row++) {
    var rowPanel = ui.Panel({
      layout: ui.Panel.Layout.flow('horizontal'),
      style: {stretch: 'horizontal', margin: '5px 0'}
    });
    
    for (var col = 0; col < numCols; col++) {
      var index = row * numCols + col;
      if (index < numResults) {
        var result = results[index];
        var cellPanel = ui.Panel({
          style: {width: '33%', padding: '5px', margin: '0 2px'}
        });
        
        var timeSeries = extractTimeSeriesData(result);
        if (timeSeries) {
          var chartData = [['Date', result.data.parameter.split(' - ')[0]]];
          timeSeries.forEach(function(point) {
            chartData.push([new Date(point.date), point.value]);
          });
          
          var chart = ui.Chart(chartData, 'LineChart').setOptions({
            title: result.data.parameter.split(' - ')[0],
            hAxis: {title: 'Date', format: 'MMM'},
            vAxis: {title: 'Value'},
            colors: ['#1976D2'],
            height: 200,
            legend: 'none',
            fontSize: 10
          });
          cellPanel.add(chart);
        } else {
          cellPanel.add(ui.Label('No time series data available', {
            fontSize: '11px',
            color: 'gray'
          }));
        }
        
        rowPanel.add(cellPanel);
      }
    }
    
    targetPanel.add(rowPanel);
  }
}

function createCorrelationMatrix(results, targetPanel) {
  targetPanel.clear();
  
  targetPanel.add(ui.Label('🔗 Correlation Matrix Analysis', {
    fontWeight: 'bold',
    fontSize: '16px',
    margin: '0 0 10px 0'
  }));
  
  // Extract all time series data
  var timeSeriesCollection = results.map(function(result) {
    return {
      name: result.data.parameter.split(' - ')[0],
      data: extractTimeSeriesData(result)
    };
  }).filter(function(item) {
    return item.data && item.data.length > 0;
  });
  
  if (timeSeriesCollection.length < 2) {
    targetPanel.add(ui.Label('❌ Χρειάζονται τουλάχιστον 2 έγκυρες χρονοσειρές!', {color: 'red'}));
    return;
  }
  
  // Create correlation matrix
  var correlationMatrix = [];
  var paramNames = timeSeriesCollection.map(function(item) { return item.name; });
  
  // Header row
  correlationMatrix.push(['Parameter'].concat(paramNames));
  
  // Calculate correlations
  paramNames.forEach(function(param1, i) {
    var row = [param1];
    paramNames.forEach(function(param2, j) {
      if (i === j) {
        row.push(1.0); // Self-correlation
      } else {
        var correlation = calculateCorrelation(
          timeSeriesCollection[i].data,
          timeSeriesCollection[j].data
        );
        row.push(correlation !== null ? correlation.toFixed(3) : 'N/A');
      }
    });
    correlationMatrix.push(row);
  });
  
  // Display correlation matrix as formatted text
  var matrixText = 'Correlation Matrix:\n\n';
  correlationMatrix.forEach(function(row, i) {
    if (i === 0) {
      matrixText += row.map(function(cell, j) {
        return j === 0 ? cell.padEnd(15) : cell.toString().padStart(8);
      }).join(' ') + '\n';
    } else {
      matrixText += row.map(function(cell, j) {
        return j === 0 ? cell.padEnd(15) : cell.toString().padStart(8);
      }).join(' ') + '\n';
    }
  });
  
  var matrixLabel = ui.Label(matrixText, {
    fontFamily: 'monospace',
    fontSize: '11px',
    whiteSpace: 'pre',
    backgroundColor: '#f8f9fa',
    padding: '10px'
  });
  
  targetPanel.add(matrixLabel);
  
  // Add interpretation guide
  var interpretationPanel = ui.Panel({
    style: {margin: '10px 0', padding: '10px', backgroundColor: '#e3f2fd'}
  });
  
  interpretationPanel.add(ui.Label('📖 Correlation Interpretation Guide:', {fontWeight: 'bold'}));
  interpretationPanel.add(ui.Label('• 0.7 to 1.0: Strong positive correlation', {fontSize: '12px'}));
  interpretationPanel.add(ui.Label('• 0.3 to 0.7: Moderate positive correlation', {fontSize: '12px'}));
  interpretationPanel.add(ui.Label('• -0.3 to 0.3: Weak/no correlation', {fontSize: '12px'}));
  interpretationPanel.add(ui.Label('• -0.7 to -0.3: Moderate negative correlation', {fontSize: '12px'}));
  interpretationPanel.add(ui.Label('• -1.0 to -0.7: Strong negative correlation', {fontSize: '12px'}));
  
  targetPanel.add(interpretationPanel);
}

function createStatisticalSummary(results, targetPanel) {
  targetPanel.clear();
  
  targetPanel.add(ui.Label('📈 Statistical Summary Report', {
    fontWeight: 'bold',
    fontSize: '16px',
    margin: '0 0 15px 0'
  }));
  
  var summaryData = results.map(function(result) {
    var timeSeries = extractTimeSeriesData(result);
    if (!timeSeries || timeSeries.length === 0) {
      return {
        parameter: result.data.parameter.split(' - ')[0],
        analysisType: result.analysisType,
        count: 0,
        mean: null,
        min: null,
        max: null,
        std: null,
        range: null
      };
    }
    
    var values = timeSeries.map(function(point) { return point.value; })
                           .filter(function(v) { return v !== null && !isNaN(v); });
    
    if (values.length === 0) {
      return {
        parameter: result.data.parameter.split(' - ')[0],
        analysisType: result.analysisType,
        count: 0,
        mean: null,
        min: null,
        max: null,
        std: null,
        range: null
      };
    }
    
    var mean = values.reduce(function(a, b) { return a + b; }, 0) / values.length;
    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    var variance = values.reduce(function(acc, val) { 
      return acc + Math.pow(val - mean, 2); 
    }, 0) / values.length;
    var std = Math.sqrt(variance);
    
    return {
      parameter: result.data.parameter.split(' - ')[0],
      analysisType: result.analysisType,
      count: values.length,
      mean: mean,
      min: min,
      max: max,
      std: std,
      range: max - min
    };
  });
  
  // Create summary table
  var tablePanel = ui.Panel({
    style: {backgroundColor: '#f8f9fa', padding: '10px', margin: '0 0 15px 0'}
  });
  
  // Header
  var headerPanel = ui.Panel({
    layout: ui.Panel.Layout.flow('horizontal'),
    style: {backgroundColor: '#343a40', padding: '5px'}
  });
  
  ['Parameter', 'Type', 'Count', 'Mean', 'Min', 'Max', 'Std Dev', 'Range'].forEach(function(header) {
    headerPanel.add(ui.Label(header, {
      color: 'white',
      fontWeight: 'bold',
      fontSize: '11px',
      width: '80px'
    }));
  });
  
  tablePanel.add(headerPanel);
  
  // Data rows
  summaryData.forEach(function(data, i) {
    var rowPanel = ui.Panel({
      layout: ui.Panel.Layout.flow('horizontal'),
      style: {
        backgroundColor: i % 2 === 0 ? '#ffffff' : '#f8f9fa',
        padding: '3px'
      }
    });
    
    [
      data.parameter,
      data.analysisType,
      data.count.toString(),
      data.mean !== null ? data.mean.toFixed(3) : 'N/A',
      data.min !== null ? data.min.toFixed(3) : 'N/A',
      data.max !== null ? data.max.toFixed(3) : 'N/A',
      data.std !== null ? data.std.toFixed(3) : 'N/A',
      data.range !== null ? data.range.toFixed(3) : 'N/A'
    ].forEach(function(value) {
      rowPanel.add(ui.Label(value, {
        fontSize: '10px',
        width: '80px'
      }));
    });
    
    tablePanel.add(rowPanel);
  });
  
  targetPanel.add(tablePanel);
  
  // Add export button for summary
  var exportSummaryButton = ui.Button({
    label: '📊 Export Summary as CSV',
    onClick: function() {
      exportStatisticalSummary(summaryData);
    },
    style: {backgroundColor: '#17a2b8', color: 'white'}
  });
  
  targetPanel.add(exportSummaryButton);
}

function exportStatisticalSummary(summaryData) {
  var csvContent = 'Parameter,Analysis_Type,Count,Mean,Min,Max,Std_Dev,Range\n';
  
  summaryData.forEach(function(data) {
    csvContent += [
      data.parameter,
      data.analysisType,
      data.count,
      data.mean !== null ? data.mean.toFixed(6) : '',
      data.min !== null ? data.min.toFixed(6) : '',
      data.max !== null ? data.max.toFixed(6) : '',
      data.std !== null ? data.std.toFixed(6) : '',
      data.range !== null ? data.range.toFixed(6) : ''
    ].join(',') + '\n';
  });
  
  print('=== STATISTICAL SUMMARY EXPORT ===');
  print('Parameters analyzed: ' + summaryData.length);
  print('Copy the data below to save as CSV:');
  print(csvContent);
}

function createDualAxisComparison(result1, result2, targetPanel) {
  targetPanel.clear();
  
  // Extract time series data from both results
  var data1 = extractTimeSeriesData(result1);
  var data2 = extractTimeSeriesData(result2);
  
  if (!data1 || !data2) {
    targetPanel.add(ui.Label('❌ Δεν ήταν δυνατή η εξαγωγή δεδομένων χρονοσειρών!', {color: 'red'}));
    return;
  }
  
  // Create dual-axis chart data
  var chartData = [['Date', result1.data.parameter.split(' - ')[0], result2.data.parameter.split(' - ')[0]]];
  
  // Merge data by date
  var mergedData = {};
  data1.forEach(function(point) {
    mergedData[point.date] = {date: point.date, value1: point.value};
  });
  
  data2.forEach(function(point) {
    if (mergedData[point.date]) {
      mergedData[point.date].value2 = point.value;
    } else {
      mergedData[point.date] = {date: point.date, value2: point.value};
    }
  });
  
  // Convert to chart format
  Object.values(mergedData).forEach(function(point) {
    chartData.push([
      new Date(point.date),
      point.value1 || null,
      point.value2 || null
    ]);
  });
  
  var dualAxisChart = ui.Chart(chartData, 'LineChart').setOptions({
    title: 'Dual-Axis Comparison: ' + result1.data.parameter.split(' - ')[0] + ' vs ' + result2.data.parameter.split(' - ')[0],
    hAxis: {title: 'Date', format: 'MMM dd'},
    vAxes: {
      0: {title: result1.data.parameter.split(' - ')[0], color: '#1976D2'},
      1: {title: result2.data.parameter.split(' - ')[0], color: '#D32F2F'}
    },
    series: {
      0: {targetAxisIndex: 0, color: '#1976D2', lineWidth: 2, pointSize: 4},
      1: {targetAxisIndex: 1, color: '#D32F2F', lineWidth: 2, pointSize: 4}
    },
    height: 400,
    backgroundColor: '#f5f5f5'
  });
  
  targetPanel.add(dualAxisChart);
  
  // Add correlation analysis
  var correlation = calculateCorrelation(data1, data2);
  if (correlation !== null) {
    targetPanel.add(ui.Label('📊 Συσχέτιση: ' + correlation.toFixed(3), {
      fontWeight: 'bold',
      margin: '10px 0 0 0'
    }));
  }
}

